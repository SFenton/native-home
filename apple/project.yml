name: FentonHome
options:
  bundleIdPrefix: com.sfenton.home
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  FentonHomeApple:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Device builds need a signing team; the generated project is git-ignored, so a team picked in
    # Xcode is lost on every `xcodegen generate`.
    DEVELOPMENT_TEAM: 3Q9X8JX23S
    CODE_SIGN_STYLE: Automatic
    # Local and simulator builds keep 0.1.0 (1). A release build passes the version tag's numbers on the xcodebuild
    # command line (`tools/release/versioning.py build-settings --tag ios/v<YYMM.DD.NN> --build <n>`), which
    # override these for every target, the Watch app's generated Info.plist included
    # (`.agents/workflow/versioning.md`). HASS_GIT_SHA reaches Info.plist as HassGitSHA (`AppBuildInfo`).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    HASS_GIT_SHA: dev
    # The sign-in Server field's default (`HassServer.buildDefault`). Empty in the repo and blank in the hosted release
    # artifact build; only a manual testflight_upload.sh passes it on the xcodebuild command line, from a testflight secret.
    HASS_DEFAULT_SERVER: ""
targets:
  FentonHome:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      # The Live Activity's App Intents, compiled into the app (they run here) and the widget extension (it draws them).
      - path: Apps/Shared
    dependencies:
      - package: FentonHomeApple
        product: HassUI
      - package: FentonHomeApple
        product: FentonActivityModel
      # The Home Live Activity (Lock Screen, Dynamic Island) draws in this extension.
      - target: FentonHomeWidgets
      # Finishes Fenton Push notifications: buttons, camera snapshots (`.agents/platforms/apple/push.md`).
      - target: FentonHomeNotificationService
      # The live camera view of an expanded camera notification (UIKit).
      - target: FentonHomeNotificationContent
    # The app is UIKit (`.agents/platforms/apple/uikit-port.md`): `UKSceneDelegate` (UISceneConfigurations below) draws
    # every window's root. Push Notifications and the app group the notification service extension shares the sign-in
    # Keychain item through (KeychainTokenStore.sharedAccessGroup). TestFlight archives switch aps-environment to production.
    # Access Wi-Fi Information lets the SSID and BSSID sensors read the network name, as the official app does
    # (`.agents/platforms/apple/location.md`). Self-service capability; no Apple review.
    entitlements:
      path: Apps/iOS/FentonHome.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.sfenton.home
        com.apple.developer.networking.wifi-info: true
        # Time-sensitive notifications break through a Focus; without it iOS delivers `interruption-level:
        # time-sensitive` as Active. Self-service capability.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The seven alternates of Settings → App Icon (`AppIconChoice`, `.agents/design/direction-g.md` App icon); the
        # names must match the asset sets in Apps/iOS/Assets.xcassets, which `tools/render_app_icons.sh` writes. The
        # compiler lists them under CFBundleIcons / CFBundleAlternateIcons in the built Info.plist.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-TealMint AppIcon-PlumLilac AppIcon-ForestGreen AppIcon-BurgundyRose
          AppIcon-IndigoPeriwinkle AppIcon-EspressoAmber AppIcon-MidnightGold
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/iOS/Info.plist
      properties:
        # The public name (owner, 2026-10-17); the bundle id stays com.sfenton.home. `AppBranding` mirrors these.
        # CFBundleSpokenName is what VoiceOver and Siri say for "S+H"; INAlternativeAppNames lets Siri take the old
        # and platform names in an App Shortcut phrase (three at most). `.agents/platforms/apple/app-name.md`.
        CFBundleDisplayName: S+H
        CFBundleSpokenName: S and H
        INAlternativeAppNames:
          - INAlternativeAppName: Home Assistant
            INAlternativeAppNamePronunciationHint: home assistant
          - INAlternativeAppName: HASS
            INAlternativeAppNamePronunciationHint: hass like pass
          - INAlternativeAppName: Fenton Home
            INAlternativeAppNamePronunciationHint: fenton home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HassGitSHA: $(HASS_GIT_SHA)
        HASS_DEFAULT_SERVER: $(HASS_DEFAULT_SERVER)
        # Export compliance: the app only uses the system's standard HTTPS/TLS (and Home Assistant's websocket over it),
        # which is exempt, so App Store Connect never asks about encryption (`.agents/platforms/apple/testflight.md`).
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan item barcodes and printed expiration dates to add groceries to your inventory.
        NSPhotoLibraryAddUsageDescription: Save camera snapshots to your photo library.
        # Location reports Home and Away to Home Assistant (`.agents/platforms/apple/location.md`).
        NSLocationWhenInUseUsageDescription: S+H shares your location with Home Assistant to know when you're home or away.
        NSLocationAlwaysAndWhenInUseUsageDescription: S+H shares your location with Home Assistant to know when you're home or away, even when the app is closed.
        # Zone crossings and significant location changes relaunch the app in the background; silent pushes run
        # commands such as clear_notification (contract v1, rule 3).
        # `fetch` is Background App Refresh (BGAppRefreshTask) for the location update every 15 minutes or so
        # (`BackgroundRefresh`); `remote-notification` also carries the request_location_update push.
        UIBackgroundModes:
          - location
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.sfenton.home.backgroundfetch
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The Home Live Activity (`.agents/platforms/apple/live-activities.md`). NSSupportsLiveActivitiesFrequentUpdates
        # stays off until Apple throttles the pushes (spec, Engine rules 4).
        NSSupportsLiveActivities: true
        # A tap on the activity opens the focused job's page (`fentonhome://liveactivity?url=…`, ActivityDeepLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.sfenton.home.liveactivity
            CFBundleURLSchemes:
              - fentonhome
        # Lets ProMotion iPhones scroll and animate at 120 Hz; without it the app is capped at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # At home the app talks to Home Assistant on its home network address (plain HTTP on port 8123) instead of
        # the public URL through Cloudflare; it finds it by its Bonjour advertisement (LocalServerRoute,
        # `.agents/platforms/apple/connection-lifecycle.md`). NSAllowsLocalNetworking permits HTTP only to local
        # names and addresses; every other host still needs HTTPS.
        NSLocalNetworkUsageDescription: S+H connects to Home Assistant directly on your home network, which is faster than going through the internet.
        NSBonjourServices:
          - _home-assistant._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).UKSceneDelegate
        # iPhone is portrait-only; iPad allows all four. iPhone Duo gets every orientation at runtime
        # once a hinge is observed (FentonOrientationSupport, owner 2026-10-10).
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FentonHomeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/NotificationService
    dependencies:
      - package: FentonHomeApple
        product: HassCore
    entitlements:
      path: Apps/NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Apps/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: S+H Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  FentonHomeNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/NotificationContent
      - path: Apps/NotificationContentShared
    dependencies:
      - package: FentonHomeApple
        product: HassCore
      # Linked explicitly: the system resolves the extension's context class from it before any of our code runs,
      # and Swift's autolink alone left it unloaded (crash in _extensionContextClass, seen 2026-10-14).
      - sdk: UserNotificationsUI.framework
    entitlements:
      path: Apps/NotificationContent/NotificationContent.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.NotificationContent
        TARGETED_DEVICE_FAMILY: "1,2"
        # Keep the code in the extension's own binary rather than Xcode's Debug-only dylib.
        ENABLE_DEBUG_DYLIB: NO
    info:
      path: Apps/NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: S+H Camera Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: fenton.camera
            UNNotificationExtensionInitialContentSizeRatio: 0.5625
            UNNotificationExtensionDefaultContentHidden: false
  FentonHomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
      - path: Apps/Shared
    dependencies:
      # The model and the views only: no HAKit, no networking, no Keychain.
      - package: FentonHomeApple
        product: FentonActivityModel
      - package: FentonHomeApple
        product: FentonActivityViews
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Apps/Widgets/FentonHomeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sfenton.home
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_DEBUG_DYLIB: NO
        # An extension may only use extension-safe API (HassDesign draws the activity's colours).
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: S+H Live Activities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Not a dependency of FentonHome and not in its scheme, so no build ships a Watch app until the scope in
  # `.agents/design/apple/watchos.md` is built (owner, 2026-10-23: no empty Watch app).
  FentonHomeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/watchOS
    dependencies:
      - package: FentonHomeApple
        product: HassCore
      - package: FentonHomeApple
        product: HassDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.sfenton.home
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: S+H
  FentonHomeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOSUITests
    dependencies:
      - target: FentonHome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.uitests
        TEST_TARGET_NAME: FentonHome
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Registers the test impact observer once for every test class (ImpactRecorder.swift).
        INFOPLIST_KEY_NSPrincipalClass: FentonImpactRecorder
  FentonHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOSTests
    dependencies:
      - target: FentonHome
      - package: FentonHomeApple
        product: HassDesign
      - package: FentonHomeApple
        product: HassUI
      - package: FentonHomeApple
        product: HassDemoHouse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.home.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FentonHome.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FentonHome
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FentonHome:
    build:
      targets:
        FentonHome: all
    test:
      # Journeys run without code coverage: it made xcodebuild hang after the tests (research 2026-10-29), and the
      # 95% gate is measured by tools/apple_coverage.sh (swift test), not by this scheme. The plans (apple/TestPlans,
      # generated by tools/test_plans.py) set the same, plus test timeouts.
      gatherCoverageData: false
      targets:
        - FentonHomeTests
        - FentonHomeUITests
      testPlans:
        - path: TestPlans/Gate.xctestplan
          defaultPlan: true
        - path: TestPlans/Smoke.xctestplan
        - path: TestPlans/Capture.xctestplan
        - path: TestPlans/Perf.xctestplan
        - path: TestPlans/Live.xctestplan
