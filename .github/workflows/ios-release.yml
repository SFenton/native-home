name: ios-release
# The release pipeline (owner, 2026-11-09): every push to main bumps the version and builds and signs a release IPA, kept as a
# workflow artifact. It runs no tests, no coverage and no simulator, and it does not wait for pr-checks: the pull request that
# landed already passed it (the merge gate), and this pipeline only versions and signs what is on main.
#   bump  (ubuntu)  tools/release/versioning.py bump --head $GITHUB_SHA --push: tags the next ios/v<YYMM.DD.NN> when the app changed
#                   since the previous tag (skips: no app change, already tagged, behind). It needs no secrets, so it always runs, and
#                   it dispatches ios-release-build.yml (TestFlight) for the new tag only when HASS_TESTFLIGHT_ENABLED is `true`.
#   ipa   (macOS)   only when a tag came out: GitHub-hosted runner (same label as the pr-checks macOS job), the `release-signing`
#                   environment (limited to main) holds the signing secrets. A temporary keychain gets the Apple Distribution and
#                   Apple Development p12s (so a fresh runner never mints certificates), the Admin App Store Connect key signs the
#                   profiles, tools/release/ios_ipa_build.sh archives and exports, and the IPA plus dSYMs are uploaded as the
#                   artifact FentonHome-<version> (30 days). Until the secrets exist the job fails with an error naming them.
# The repository is public: the IPA is never attached to the GitHub Release (assets are anonymous and permanent), and
# HASS_DEFAULT_SERVER is masked in the log. Nothing is uploaded to App Store Connect here (export only; TestFlight is the other workflow).
# A tag pushed with GITHUB_TOKEN triggers no workflow, which is why the ipa job is a job of this workflow and not a tag trigger.
# "Run workflow": `tag` rebuilds an existing ios/v* tag without bumping; `force` bumps even without app changes.
# Owner checklist (environment, secrets, yearly renewal): .agents/platforms/apple/testflight.md. Documentation: .agents/workflow/ci.md, versioning.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild this existing version tag (ios/v<YYMM.DD.NN>) without bumping; empty bumps the commit the run is on
        type: string
        default: ''
      force:
        description: Bump even without app changes since the previous tag (ignored when a tag is given)
        type: boolean
        default: false
defaults:
  run:
    shell: bash
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # push version tags
      actions: write    # dispatch ios-release-build.yml
    concurrency:
      # One bump at a time, never cancelled. GitHub keeps one pending run per group and may drop the others; that is safe, because
      # bumping is a function of the commit ("the app changed since the previous tag"): the newest head covers every merge before
      # it, and an older head that runs late is skipped as behind_previous_tag.
      group: ios-release-bump
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Bump
        id: bump
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          REBUILD_TAG: ${{ inputs.tag }}
          TESTFLIGHT: ${{ vars.HASS_TESTFLIGHT_ENABLED }}
        run: |
          set -euo pipefail
          if [ -n "$REBUILD_TAG" ]; then
            [[ "$REBUILD_TAG" =~ ^ios/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || { echo "::error title=Not a version tag::$REBUILD_TAG"; exit 1; }
            git rev-parse -q --verify "refs/tags/$REBUILD_TAG" > /dev/null || { echo "::error title=No such tag::$REBUILD_TAG"; exit 1; }
            echo "tag=$REBUILD_TAG" >> "$GITHUB_OUTPUT"
            echo "### ios-release: rebuild of \`$REBUILD_TAG\` (no bump)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(bump --head "$GITHUB_SHA" --push)
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          python3 tools/release/versioning.py "${args[@]}" | tee "$RUNNER_TEMP/bump.json"
          tag="$(python3 -c 'import json,sys; print(" ".join(p["tag"] for p in json.load(open(sys.argv[1])).get("bumped", [])))' "$RUNNER_TEMP/bump.json")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && [ "$TESTFLIGHT" = "true" ]; then
            # The TestFlight run uploads every version not yet on TestFlight, oldest first; the tag only wakes it.
            gh workflow run ios-release-build.yml --ref main -f version_tag="$tag"
          fi
          python3 - "$RUNNER_TEMP/bump.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print("### ios-release: bump")
          for plan in doc.get("bumped", []):
              print("- **%s** → `%s` (%s)" % (plan["platform"], plan["tag"], plan["reason"]))
          for plan in doc.get("skipped", []):
              print("- %s: skipped, no IPA (%s)" % (plan["platform"], plan["reason"]))
          PY

  ipa:
    needs: bump
    # Only when a tag came out, and, like every hosted macOS job (tools/tests/test_hosted_workflows.py), behind the HOSTED_MACOS variable.
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.bump.outputs.tag != '' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    environment: release-signing   # limited to main; holds the signing secrets
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: ios-release-ipa-${{ needs.bump.outputs.tag }}
      cancel-in-progress: false
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      TAG: ${{ needs.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ needs.bump.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Use the release tooling of the workflow's own commit
        # A rebuilt tag may predate these scripts: the app source comes from the tag, the release tooling from the commit this
        # workflow runs at (fetch-depth 0 already has it).
        run: |
          set -euo pipefail
          git checkout "$GITHUB_SHA" -- tools/release/ios_ipa_build.sh tools/release/ExportOptions-appstore.plist tools/release/versioning.py
      - name: Check the signing secrets
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD APPLE_DEVELOPMENT_P12_BASE64 APPLE_DEVELOPMENT_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=ios-release cannot sign::Missing in the release-signing environment:$missing. Owner checklist: .agents/platforms/apple/testflight.md (Release pipeline: owner checklist)."
            exit 1
          fi
      - name: Prepare the runner (xcodegen is not on the image)
        # The same line as tools/ci_hosted_setup.sh, inline so this signing workflow's closure stays the release files only.
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          xcodebuild -version
      - name: Temporary keychain with the signing identities
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for kind in DISTRIBUTION DEVELOPMENT; do
            data="APPLE_${kind}_P12_BASE64"; pass="APPLE_${kind}_P12_PASSWORD"
            file="$RUNNER_TEMP/apple-${kind}.p12"
            printf '%s' "${!data}" | base64 --decode > "$file"
            chmod 600 "$file"
            security import "$file" -P "${!pass}" -A -t cert -f pkcs12 -k "$keychain"
            rm -f "$file"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do line="${line//\"/}"; line="${line#"${line%%[![:space:]]*}"}"; [ -z "$line" ] || existing+=("$line"); done < <(security list-keychain -d user)
          security list-keychain -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          security default-keychain -s "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          count="$(echo "$identities" | grep -cE '^[[:space:]]+[0-9]+\) ' || true)"
          if [ "$count" -lt 2 ] || ! echo "$identities" | grep -q 'Apple Distribution' || ! echo "$identities" | grep -q 'Apple Development'; then
            echo "::error title=ios-release found fewer than two signing identities::Expected an Apple Distribution and an Apple Development identity in the keychain, found $count valid. Re-export the p12s (a certificate lasts a year): .agents/platforms/apple/testflight.md."
            exit 1
          fi
      - name: App Store Connect API key (temporary file)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$dir/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$dir/AuthKey_$ASC_KEY_ID.p8"
          { echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8"; } >> "$GITHUB_ENV"
      - name: Archive and export the IPA
        id: build
        env:
          FENTON_DERIVED_DATA: ${{ runner.temp }}/dd
          # The sign-in Server field's default (a repository variable). The repository is public, so the value is masked in the log.
          HASS_DEFAULT_SERVER: ${{ vars.HASS_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          if [ -n "$HASS_DEFAULT_SERVER" ]; then echo "::add-mask::$HASS_DEFAULT_SERVER"; fi
          build="$(date -u +%Y%m%d%H%M)"
          tools/release/ios_ipa_build.sh "$TAG" "$build" | tee "$RUNNER_TEMP/build.out"
          { echo "version=${TAG#ios/v}"; echo "build=$build"; echo "ipa=$(sed -n 's/^ipa=//p' "$RUNNER_TEMP/build.out")"; echo "dsyms=$(sed -n 's/^dsyms=//p' "$RUNNER_TEMP/build.out")"; } >> "$GITHUB_OUTPUT"
      - name: Upload the IPA and dSYMs (workflow artifact, not a Release asset)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FentonHome-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.ipa }}
            ${{ steps.build.outputs.dsyms }}
          retention-days: 30
          if-no-files-found: error
      - name: Summary
        env:
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          {
            echo "### ios-release $TAG"
            echo "- Version: $VERSION"
            echo "- Build number: $BUILD"
            echo "- Artifact: FentonHome-$VERSION (signed IPA and dSYMs, kept 30 days; download it from this run's Artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keychain, certificates and API key
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then security delete-keychain "$RELEASE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/apple-*.p12
          rm -rf "$RUNNER_TEMP/asc"
