name: ios-release-build
# Archives, signs and uploads every `ios/v<YYMM.DD.NN>` version that is not yet on TestFlight, oldest first, to App
# Store Connect (internal TestFlight; the "Internal" group distributes automatically, so an upload is a deploy).
# Nothing here runs on a push, a pull request or a branch: the only starts are version-bump.yml, after a successful
# pr-checks on main and a new tag, and a manual "Run workflow" (a catch-up or a dry run).
# Ordering: the run does not build "the tag it was woken for". tools/release/testflight_queue.py lists every ios/v* tag
# without an `ios/tf/<version>` ledger tag, uploads them oldest first, writes the ledger tag after each upload and stops
# at the first failure. GitHub keeps one pending run per concurrency group and may drop the others, so the queue is in
# git: a dropped run is harmless because the next run catches up. Build numbers strictly increase in upload order.
# Off until the repository variable HASS_TESTFLIGHT_ENABLED is `true` (a dry run always works). Runs only on main, in the
# `testflight` environment, which holds the three App Store Connect API key secrets and admits only main.
# Signing is cloud-managed through the API key (-allowProvisioningUpdates -authenticationKey*), no certificate secrets.
# Runs on the MacBook runner (self-hosted, macOS, hass), like every signing or simulator job (.agents/workflow/ci.md). The Watch app is never built or shipped.
# Documentation: .agents/platforms/apple/testflight.md, .agents/workflow/versioning.md.
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: First tag to upload when nothing has been uploaded yet (ios/v<YYMM.DD.NN>); ignored once a ledger exists. Empty = the newest tag
        type: string
        default: ''
      dry_run:
        description: Print the archive/export commands for the pending versions without running or uploading anything
        type: boolean
        default: false
permissions:
  contents: write   # push the ledger tags ios/tf/<version>
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  testflight:
    if: github.ref == 'refs/heads/main' && (inputs.dry_run == true || vars.HASS_TESTFLIGHT_ENABLED == 'true')
    runs-on: [self-hosted, macOS, hass]
    environment: testflight
    timeout-minutes: 300   # up to 10 versions per run at about 25 minutes each; the next run continues
    concurrency:
      # One upload loop at a time, never cancelled. A third run replaces the one pending run; that loses nothing
      # (the queue is rebuilt from the tags at the start and again after every upload).
      group: ios-release-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          clean: false
      - name: Reset the workspace (keeps the build caches)
        run: git clean -ffdx -e apple/.build -e build
      - name: Disk pre-flight (30 GB free)
        run: python3 tools/ci_hygiene.py preflight --min-gb 30
      - name: Check the tag input
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          [ -z "$VERSION_TAG" ] || [[ "$VERSION_TAG" =~ ^ios/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || { echo "not a version tag: $VERSION_TAG"; exit 1; }
      - name: App Store Connect API key (temporary file)
        if: inputs.dry_run != true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error title=ios-release-build has no API key::Set ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY in the testflight environment (.agents/platforms/apple/testflight.md, owner checklist)."
            exit 1
          fi
          dir="$RUNNER_TEMP/asc"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$dir/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$dir/AuthKey_$ASC_KEY_ID.p8"
          { echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8"; } >> "$GITHUB_ENV"
      - name: Upload the pending versions, oldest first
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The sign-in Server field's default (a repository variable, not a secret); empty leaves the field blank.
          HASS_DEFAULT_SERVER: ${{ vars.HASS_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(run --max 10)
          if [ -n "$VERSION_TAG" ]; then args+=(--from "$VERSION_TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          { echo "### ios-release-build"; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/release/testflight_queue.py "${args[@]}"
      - name: Remove the API key and build output
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$GITHUB_WORKSPACE/build/testflight"
