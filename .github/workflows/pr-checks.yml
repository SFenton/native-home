name: pr-checks
# The merge gate: the aggregate job `pr-checks` (GitHub requires it by name). Everything runs on GitHub-hosted runners.
# Linux: the repo checks, the Python tool tests, the denylist scan and the aggregate. macOS (only while the repository variable
# HOSTED_MACOS is `on`): swift test, the Release build and the Smoke simulators. All of them run on plain `pull_request` with no
# secrets (except the denylist scan), FENTON_CI_HOSTED=1 (tools/ci_hosted.py) and no devcap.
# Documentation: .agents/workflow/pr-lifecycle.md, .agents/workflow/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope_base:
        description: "Test the job filter: compare scope_base..scope_head instead of running everything (empty = run everything)"
        required: false
        default: ""
      scope_head:
        description: "Head commit for scope_base (default: this ref)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  # ---------------------------------------------------------------------------------------------------------------------
  # Hosted jobs. macOS: only when the repository variable HOSTED_MACOS is `on`, never keyed on visibility, which is empty on some
  # triggers. Plain pull_request, no secrets, FENTON_CI_HOSTED=1, nothing self-hosted.
  # ---------------------------------------------------------------------------------------------------------------------
  scope:
    # Which jobs a change needs, from GitHub's own changed-file list (dorny/paths-filter): the files of the pull request, not a diff against
    # a base commit that may have moved. Unknown paths count as app, and a push to main runs everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the filter lists a pull request's files through the API
    outputs:
      app: ${{ steps.filter.outcome == 'skipped' && 'true' || (steps.filter.outputs.app_code == 'true' || steps.filter.outputs.app_tools == 'true') }}
      release: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.release }}
    steps:
      # Only the manual run compares commits itself (scope_base..scope_head), so it needs the history.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope_base != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scope_base != '') }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ inputs.scope_base }}
          ref: ${{ inputs.scope_head }}
          # `every` applies to all filters: a file must match every pattern of a filter, so app_code subtracts with its negations and
          # the other two filters are one brace pattern each.
          # app_code: every path that is not documentation or Python tooling.
          # app_tools: the tools and contracts that drive the iOS jobs, which `tools/**` would otherwise hide.
          predicate-quantifier: every
          filters: |
            app_code:
              - '**'
              - '!**/*.md'
              - '!.agents/**'
              - '!.claude/**'
              - '!docs/**'
              - '!tools/**'
              - '!contracts/test-map*'
              - '!contracts/test-suites*'
            app_tools: '{tools/ios_uitest.sh,tools/affected_tests.py,tools/lane_base.py,tools/test_plans.py,tools/test_suites.py,tools/test_impact.py,tools/uitest_support.py,tools/products_cache.py,tools/xc_watch.py,tools/sim_*.sh,tools/simslim/**,tools/ci_hosted*,tools/ci_heartbeat.sh,tools/push_fixtures/**,contracts/test-map*,contracts/test-suites*}'
            release: 'apple/**'
      - name: Summary
        env:
          APP: ${{ steps.filter.outcome == 'skipped' && 'true' || (steps.filter.outputs.app_code == 'true' || steps.filter.outputs.app_tools == 'true') }}
          RELEASE: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.release }}
          FILTER: ${{ steps.filter.outcome }}
        run: |
          echo "scope - app=$APP release=$RELEASE (filter $FILTER)" | tee -a "$GITHUB_STEP_SUMMARY"

  repo-checks-hosted:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mockups
        run: |
          python3 tools/mockups_check.py
          python3 tools/mockups_index.py --check
      - name: Pattern and component registry, Jev sync
        run: |
          python3 tools/pattern_guard.py
          python3 tools/components_index.py --check
          python3 tools/jev_ask.py sync --check
      - name: House-data lint
        run: python3 tools/house_scan.py
      - name: Motion lint
        run: tools/lint_motion.sh
      - name: Test plans are current
        run: python3 tools/test_plans.py --check
      - name: Test suites resolve
        run: python3 tools/test_suites.py check

  tool-tests-hosted:
    # One job per part of tools/run_tool_tests.sh, in parallel (about 5 minutes in all on Linux, build/evidence/hosted-ci).
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [core, triage, release]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false   # tests that read history and refs need a real clone
      - name: Python tool tests (${{ matrix.part }}; a pull request fails only on failures new versus its base, owner 2026-11-04)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PART: ${{ matrix.part }}
        run: |
          if [ -n "${BASE:-}" ]; then
            python3 tools/ci_new_failures.py --base "$BASE" --part "$PART"
          else
            tools/run_tool_tests.sh "$PART"
          fi

  denylist-scan:
    # The owner's private house-term list, from a repository secret, counted and never printed. Runs private or public, on same-repo
    # events only (a fork PR gets no secret). Skips with a notice when the secret is empty; the local pr_land check covers that case.
    # Lenient while the private tree is still being scrubbed: a pull request fails only on hits NEW versus its base, a push to main
    # reports the count as a warning. TODO: fail on any hit once go_public_gate passes (then set the repository variable
    # DENYLIST_STRICT to `on`; that is the whole switch).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the denylist file (mode 600) and mask its terms
        id: list
        env:
          DENYLIST_B64: ${{ secrets.HOUSE_SCAN_DENYLIST_B64 }}
        run: |
          set +x
          if [ -z "$DENYLIST_B64" ]; then
            echo "::notice::denylist not available (fork PR or secret unset); the local pr_land check covers it"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/house_denylist.txt"
          python3 tools/ci_denylist.py mask "$RUNNER_TEMP/house_denylist.txt"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Denylist scan (counts only)
        if: steps.list.outputs.available == 'true'
        env:
          HOUSE_SCAN_DENYLIST: ${{ runner.temp }}/house_denylist.txt
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STRICT: ${{ vars.DENYLIST_STRICT }}
        run: |
          set +e
          # main's `house_scan.py denylist` (house-data-gate.md) does the scan. Only its count line is shown: the hit list (path:line) stays out of
          # the log. A pull request is judged against its base commit with the base's own config (never the tree under review); a push to
          # main counts every hit and only warns. DENYLIST_STRICT=on counts every hit and fails on any, on every event.
          args=(--root . --required true)
          if [ "$EVENT" = pull_request ] && [ "${STRICT:-off}" != on ] && git show "$BASE_SHA:contracts/house_scan.json" > "$RUNNER_TEMP/base_house_scan.json" 2> /dev/null; then
            args+=(--base-ref "$BASE_SHA" --config "$RUNNER_TEMP/base_house_scan.json")
          fi
          rc=0
          out="$(python3 tools/house_scan.py denylist "${args[@]}" 2> /dev/null)" || rc=$?
          printf '%s\n' "$out" | grep -E '^house_scan: denylist (loaded|not loaded)'
          if [ "$rc" = 1 ] && [ "$EVENT" != pull_request ] && [ "${STRICT:-off}" != on ]; then
            echo "::warning::denylist hits on $EVENT (reported, not failing until DENYLIST_STRICT is on)"
            exit 0
          fi
          exit "$rc"
      - name: Delete the denylist file
        if: always()
        run: rm -f "$RUNNER_TEMP/house_denylist.txt"

  swift-test-hosted:
    needs: scope
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.scope.outputs.app == 'true' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    timeout-minutes: 90
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the runner
        run: tools/ci_hosted_setup.sh
      - name: Selected Xcode (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: swift test (the affected suites on a pull request, everything on a push to main)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE: ${{ needs.scope.outputs.release }}
        run: |
          set -uo pipefail
          filters=""
          if [ "$EVENT" = "pull_request" ] && [ "$RELEASE" = "true" ]; then
            rc=0
            filters="$(python3 tools/affected_tests.py --swift --base "origin/$BASE_REF")" || rc=$?
            if [ "$rc" != "0" ]; then
              echo "affected_tests.py could not place every changed file (exit $rc): running the full suite" >> "$GITHUB_STEP_SUMMARY"
              filters="ALL"
            elif [ -z "$filters" ]; then
              echo "no Swift package suite is affected by this change: swift test skipped" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            filters="ALL"
          fi
          [ "$filters" = "ALL" ] && filters=""
          echo "swift test $filters" >> "$GITHUB_STEP_SUMMARY"
          cd apple
          # shellcheck disable=SC2086
          swift test $filters
      - name: Save SwiftPM caches (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}

  build-release-hosted:
    needs: scope
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.scope.outputs.release == 'true' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    timeout-minutes: 90
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derived data path (runner context is not allowed in job env)
        run: echo "DERIVED=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
      - name: Prepare the runner
        run: tools/ci_hosted_setup.sh
      - name: Selected Xcode (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Restore DerivedData
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: Release build (generic iOS, unsigned)
        run: |
          set -euo pipefail
          cd apple
          xcodegen generate --quiet
          xcodebuild build -project FentonHome.xcodeproj -scheme FentonHome -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO
      - name: Save DerivedData (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}

  sim-smoke:
    # Advisory for now (continue-on-error, not in the aggregate): the Smoke plan plus the journeys the diff reaches, one family per job.
    # The folded Duo only; Device Hub poses stay on the MacBook until a probe shows they work on a hosted VM.
    needs: scope
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.scope.outputs.app == 'true' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    # The Duo leg is shorter: a lost runner then frees its capacity and reports sooner (build/research/duo-hosted-ci.md).
    timeout-minutes: ${{ matrix.family == 'duo' && 60 || 90 }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, duo, ipad]
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      FENTON_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # A cold hosted simulator (the Duo above all) takes minutes to draw its first frame; the local walls are 20 s and 120 s.
      FENTON_HEALTH_SHOT_WALL: "180"
      FENTON_HEALTH_BOOT_WALL: "300"
      # Hosted-only build settings (the products script adds them to the cache key, so hosted products have their own key):
      # host architecture only, no index store. Local builds never see these.
      FENTON_HOSTED_BUILD_SETTINGS: "ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derived data path (runner context is not allowed in job env)
        run: echo "FENTON_DERIVED_DATA=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
      - name: Prepare the runner
        run: |
          tools/ci_hosted_setup.sh
          # Spotlight indexing competes with the compile for 3 cores; best effort (needs sudo).
          sudo mdutil -a -i off || true
      - name: Selected Xcode (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The dd-sim-arm64 prefix follows FENTON_HOSTED_BUILD_SETTINGS (host architecture only): change both together.
      - name: Restore DerivedData
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: Build the test products first (no simulator booted; a Duo first boot beside a compile killed two runners)
        run: tools/ci_heartbeat.sh run -- tools/ios_uitest.sh --only "${{ matrix.family }}" --plan Smoke --force --build-only
      - name: Boot the ${{ matrix.family }} simulator and wait for the load to settle (first boot of a runtime on a fresh VM)
        continue-on-error: true
        run: tools/ci_heartbeat.sh run -- tools/sim_settle.sh "${{ matrix.family }}"
      - name: Smoke plan on ${{ matrix.family }}
        run: tools/ios_uitest.sh --only "${{ matrix.family }}" --plan Smoke --force
      - name: Journeys the diff reaches on ${{ matrix.family }}
        if: ${{ github.event_name == 'pull_request' }}
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          # --changed runs the Gate plan. A class Gate skips whole (the Live-plan shell journeys need the real house) matches nothing
          # there, and xcodebuild reports EMPTY, a failure. Skip only when the diff reaches journeys and Gate runs none of them.
          # A crash of the selection tool fails the step; exit 3 (a file needing a pick) falls through to the runner, which fails on it.
          rc=0
          runnable="$(python3 tools/affected_tests.py --journeys --device "$FAMILY" --plan Gate)" || rc=$?
          case "$rc" in 0|3) ;; *) echo "affected_tests.py failed (exit $rc)"; exit "$rc" ;; esac
          all="$(python3 tools/affected_tests.py --journeys --device "$FAMILY")" || true
          if [ -n "$all" ] && [ -z "$runnable" ]; then
            echo "skipped: no journey the diff reaches runs in the Gate plan on $FAMILY (selected: $all)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tools/ios_uitest.sh --only "$FAMILY" --changed --force
      - name: Save DerivedData (main only)
        if: ${{ github.ref == 'refs/heads/main' && matrix.family == 'iphone' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
      - name: Simulator diagnostics
        if: failure()
        continue-on-error: true
        run: |
          xcrun simctl list devices
          df -h / | tail -1
          log show --last 10m --style compact --predicate 'process == "CoreSimulatorService"' 2>/dev/null | tail -80 || true
      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcresult-${{ matrix.family }}
          # An .xcresult is a directory: upload-artifact matches files only, and a bare directory glob matched none on the
          # Duo failure (run 42448367681, "No files were found"). The trailing /** names the files inside.
          # apple/.build is a hidden directory, and upload-artifact v4.4+ skips hidden files unless told otherwise.
          include-hidden-files: true
          path: |
            apple/.build/uitest-*.xcresult/**
            apple/.build/uitest-*.log
          if-no-files-found: warn

  pr-checks:
    # The one check GitHub requires. A job that was skipped passes only when it was allowed to (tools/ci_aggregate.py): scope-gated
    # jobs, hosted macOS while HOSTED_MACOS is off, the denylist scan on a fork PR. sim-smoke is advisory and not listed.
    if: always()
    needs: [scope, repo-checks-hosted, tool-tests-hosted, denylist-scan, swift-test-hosted, build-release-hosted]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
          HOSTED_MACOS: ${{ vars.HOSTED_MACOS }}
        run: python3 tools/ci_aggregate.py | tee -a "$GITHUB_STEP_SUMMARY"
