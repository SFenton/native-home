name: pr-checks
# The merge gate: the aggregate job `pr-checks` (GitHub requires it by name). Everything runs on GitHub-hosted runners.
# Linux: the repo checks, the Python tool tests, the denylist scan and the aggregate. macOS (only while the repository variable
# HOSTED_MACOS is `on`): swift test, the Release build and the Smoke simulators. All of them run on plain `pull_request` with no
# secrets (except the denylist scan), FENTON_CI_HOSTED=1 (tools/ci_hosted.py) and no devcap.
# Documentation: .agents/workflow/pr-lifecycle.md, .agents/workflow/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      report_dry_run:
        description: "Test the red-run report: print the Workflow issue instead of filing it (runs even when the tests are green)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A manual run has its own group per dry-run flag; a new push still cancels the pull request's older run.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.report_dry_run) || '' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  # ---------------------------------------------------------------------------------------------------------------------
  # Hosted jobs. macOS: only when the repository variable HOSTED_MACOS is `on`, never keyed on visibility, which is empty on some
  # triggers. Plain pull_request, no secrets, FENTON_CI_HOSTED=1, nothing self-hosted.
  # ---------------------------------------------------------------------------------------------------------------------
  scope:
    # Which jobs a change needs, from GitHub's own changed-file list (dorny/paths-filter): the files of the pull request, not a diff against
    # a base commit that may have moved. Unknown paths count as app, and a push to main runs everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the filter lists a pull request's files through the API
    outputs:
      app: ${{ steps.filter.outcome == 'skipped' && 'true' || (steps.filter.outputs.app_code == 'true' || steps.filter.outputs.app_tools == 'true') }}
      release: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.release }}
    steps:
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `every` applies to all filters: a file must match every pattern of a filter, so app_code subtracts with its negations and
          # the other two filters are one brace pattern each.
          # app_code: every path that is not documentation or Python tooling.
          # app_tools: the tools and contracts that drive the iOS jobs, which `tools/**` would otherwise hide.
          predicate-quantifier: every
          filters: |
            app_code:
              - '**'
              - '!**/*.md'
              - '!.agents/**'
              - '!.claude/**'
              - '!docs/**'
              - '!tools/**'
              - '!contracts/test-map*'
              - '!contracts/test-suites*'
            app_tools: '{tools/ios_uitest.sh,tools/affected_tests.py,tools/lane_base.py,tools/test_plans.py,tools/test_suites.py,tools/test_impact.py,tools/uitest_support.py,tools/products_cache.py,tools/xc_watch.py,tools/sim_*.sh,tools/simslim/**,tools/ci_hosted*,tools/ci_heartbeat.sh,tools/ci_macos.sh,tools/push_fixtures/**,contracts/test-map*,contracts/test-suites*}'
            release: 'apple/**'
      - name: Summary
        env:
          APP: ${{ steps.filter.outcome == 'skipped' && 'true' || (steps.filter.outputs.app_code == 'true' || steps.filter.outputs.app_tools == 'true') }}
          RELEASE: ${{ steps.filter.outcome == 'skipped' && 'true' || steps.filter.outputs.release }}
          FILTER: ${{ steps.filter.outcome }}
        run: |
          echo "scope - app=$APP release=$RELEASE (filter $FILTER)" | tee -a "$GITHUB_STEP_SUMMARY"

  linux-checks:
    # The repo checks and the small tool-test parts in one job: three short Linux jobs cost three runner starts.
    name: Repo checks and tool tests (triage, release)
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false   # tests that read history and refs need a real clone
      - name: Mockups
        if: ${{ !cancelled() }}
        run: |
          python3 tools/mockups_check.py
          python3 tools/mockups_index.py --check
      - name: Pattern and component registry, Jev sync
        if: ${{ !cancelled() }}
        run: |
          python3 tools/pattern_guard.py
          python3 tools/components_index.py --check
          python3 tools/jev_ask.py sync --check
      - name: House-data lint
        if: ${{ !cancelled() }}
        run: python3 tools/house_scan.py
      - name: Motion lint
        if: ${{ !cancelled() }}
        run: tools/lint_motion.sh
      - name: Test plans are current
        if: ${{ !cancelled() }}
        run: python3 tools/test_plans.py --check
      - name: Test suites resolve
        if: ${{ !cancelled() }}
        run: python3 tools/test_suites.py check
      - name: Tool tests - triage
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PART: triage
        run: |
          # A pull request fails only on failures new versus its base (owner, 2026-11-04). Main and manual runs run the whole part
          # and keep the log for the Workflow issue.
          set -o pipefail
          if [ -n "${BASE:-}" ]; then
            python3 tools/ci_new_failures.py --base "$BASE" --part "$PART"
          else
            tools/run_tool_tests.sh "$PART" 2>&1 | tee "$RUNNER_TEMP/tool-tests-$PART.log"
          fi
      - name: Tool tests - release
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PART: release
        run: |
          # A pull request fails only on failures new versus its base (owner, 2026-11-04). Main and manual runs run the whole part
          # and keep the log for the Workflow issue.
          set -o pipefail
          if [ -n "${BASE:-}" ]; then
            python3 tools/ci_new_failures.py --base "$BASE" --part "$PART"
          else
            tools/run_tool_tests.sh "$PART" 2>&1 | tee "$RUNNER_TEMP/tool-tests-$PART.log"
          fi
      - name: Keep the logs
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tool-tests-log-linux-checks
          path: ${{ runner.temp }}/tool-tests-*.log
          if-no-files-found: ignore

  tool-tests-core:
    # The long part (about 5 minutes) gets its own job so it runs beside the other checks.
    name: Tool tests (core)
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false   # tests that read history and refs need a real clone
      - name: Tool tests - core
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PART: core
        run: |
          # A pull request fails only on failures new versus its base (owner, 2026-11-04). Main and manual runs run the whole part
          # and keep the log for the Workflow issue.
          set -o pipefail
          if [ -n "${BASE:-}" ]; then
            python3 tools/ci_new_failures.py --base "$BASE" --part "$PART"
          else
            tools/run_tool_tests.sh "$PART" 2>&1 | tee "$RUNNER_TEMP/tool-tests-$PART.log"
          fi
      - name: Keep the logs
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tool-tests-log-core
          path: ${{ runner.temp }}/tool-tests-core.log
          if-no-files-found: ignore

  denylist-scan:
    # The owner's private house-term list, from a repository secret, counted and never printed. Runs private or public, on same-repo
    # events only (a fork PR gets no secret). Skips with a notice when the secret is empty; the local pr_land check covers that case.
    # Lenient while the private tree is still being scrubbed: a pull request fails only on hits NEW versus its base, a push to main
    # reports the count as a warning. TODO: fail on any hit once go_public_gate passes (then set the repository variable
    # DENYLIST_STRICT to `on`; that is the whole switch).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the denylist file (mode 600) and mask its terms
        id: list
        env:
          DENYLIST_B64: ${{ secrets.HOUSE_SCAN_DENYLIST_B64 }}
        run: |
          set +x
          if [ -z "$DENYLIST_B64" ]; then
            echo "::notice::denylist not available (fork PR or secret unset); the local pr_land check covers it"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/house_denylist.txt"
          python3 tools/ci_denylist.py mask "$RUNNER_TEMP/house_denylist.txt"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Denylist scan (counts only)
        if: steps.list.outputs.available == 'true'
        env:
          HOUSE_SCAN_DENYLIST: ${{ runner.temp }}/house_denylist.txt
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STRICT: ${{ vars.DENYLIST_STRICT }}
        run: |
          set +e
          # main's `house_scan.py denylist` (house-data-gate.md) does the scan. Only its count line is shown: the hit list (path:line) stays out of
          # the log. A pull request is judged against its base commit with the base's own config (never the tree under review); a push to
          # main counts every hit and only warns. DENYLIST_STRICT=on counts every hit and fails on any, on every event.
          args=(--root . --required true)
          if [ "$EVENT" = pull_request ] && [ "${STRICT:-off}" != on ] && git show "$BASE_SHA:contracts/house_scan.json" > "$RUNNER_TEMP/base_house_scan.json" 2> /dev/null; then
            args+=(--base-ref "$BASE_SHA" --config "$RUNNER_TEMP/base_house_scan.json")
          fi
          rc=0
          out="$(python3 tools/house_scan.py denylist "${args[@]}" 2> /dev/null)" || rc=$?
          printf '%s\n' "$out" | grep -E '^house_scan: denylist (loaded|not loaded)'
          if [ "$rc" = 1 ] && [ "$EVENT" != pull_request ] && [ "${STRICT:-off}" != on ]; then
            echo "::warning::denylist hits on $EVENT (reported, not failing until DENYLIST_STRICT is on)"
            exit 0
          fi
          exit "$rc"
      - name: Delete the denylist file
        if: always()
        run: rm -f "$RUNNER_TEMP/house_denylist.txt"

  macos:
    # One macOS job per app change: the test products are built once and shared by every device, then Smoke runs on iPhone, iPhone Duo
    # and iPad, then the full swift test. The build and swift test are required; the Smoke and journey steps are advisory
    # (continue-on-error per step, not in the aggregate). Poses that need Device Hub stay on the MacBook.
    # The simulators boot after the build, not during it: a first Duo boot beside a compile killed two runners (the Duo is also
    # settled before it is used, tools/sim_settle.sh).
    name: macOS - build, Smoke on three devices, swift test
    needs: scope
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.scope.outputs.app == 'true' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    timeout-minutes: 150
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
      FENTON_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # A cold hosted simulator (the Duo above all) takes minutes to draw its first frame; the local walls are 20 s and 120 s.
      FENTON_HEALTH_SHOT_WALL: "180"
      FENTON_HEALTH_BOOT_WALL: "300"
      # Hosted-only build settings (the products script adds them to the cache key, so hosted products have their own key):
      # host architecture only, no index store. Local builds never see these.
      FENTON_HOSTED_BUILD_SETTINGS: "ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derived data path
        # The runner context is not allowed in job env.
        run: echo "FENTON_DERIVED_DATA=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
      - name: Prepare the runner
        run: |
          tools/ci_hosted_setup.sh
          # Spotlight indexing competes with the compile for 3 cores; best effort (needs sudo).
          sudo mdutil -a -i off || true
      - name: Selected Xcode (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # The dd-sim-arm64 prefix follows FENTON_HOSTED_BUILD_SETTINGS (host architecture only): change both together.
      - name: Restore DerivedData
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: Restore SwiftPM caches
        id: spm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: Build the test products
        id: build
        run: tools/ci_macos.sh build
      - name: Smoke on iPhone
        id: iphone
        if: ${{ !cancelled() }}
        continue-on-error: true   # Smoke is advisory until it has passed 5 runs in a row on main
        run: |
          tools/ci_macos.sh smoke iphone
      - name: Journeys the diff reaches on iPhone
        id: iphone_journeys
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: tools/ci_macos.sh journeys iphone
      - name: Smoke on iPhone Duo
        id: duo
        if: ${{ !cancelled() }}
        continue-on-error: true   # Smoke is advisory until it has passed 5 runs in a row on main
        run: |
          tools/ci_macos.sh smoke duo
      - name: Journeys the diff reaches on iPhone Duo
        id: duo_journeys
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: tools/ci_macos.sh journeys duo
      - name: Smoke on iPad
        id: ipad
        if: ${{ !cancelled() }}
        continue-on-error: true   # Smoke is advisory until it has passed 5 runs in a row on main
        run: |
          tools/ci_macos.sh smoke ipad
      - name: Journeys the diff reaches on iPad
        id: ipad_journeys
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: tools/ci_macos.sh journeys ipad
      - name: swift test
        if: ${{ !cancelled() }}
        run: tools/ci_macos.sh swift-test
      - name: Timing summary
        if: ${{ !cancelled() }}
        run: tools/ci_macos.sh summary
      - name: Simulator diagnostics
        if: ${{ !cancelled() && (steps.iphone.outcome == 'failure' || steps.duo.outcome == 'failure' || steps.ipad.outcome == 'failure' || steps.iphone_journeys.outcome == 'failure' || steps.duo_journeys.outcome == 'failure' || steps.ipad_journeys.outcome == 'failure') }}
        continue-on-error: true
        run: |
          xcrun simctl list devices
          df -h / | tail -1
          log show --last 10m --style compact --predicate 'process == "CoreSimulatorService"' 2>/dev/null | tail -80 || true
      - name: Keep the iphone results
        if: ${{ !cancelled() && (steps.iphone.outcome == 'failure' || steps.iphone_journeys.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcresult-iphone
          # An .xcresult is a directory: upload-artifact matches files only, so the trailing /** names the files inside.
          # apple/.build is hidden, and upload-artifact v4.4+ skips hidden files unless told otherwise.
          include-hidden-files: true
          path: |
            apple/.build/uitest-iphone.xcresult/**
            apple/.build/uitest-iphone.log
          if-no-files-found: ignore
      - name: Keep the duo results
        if: ${{ !cancelled() && (steps.duo.outcome == 'failure' || steps.duo_journeys.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcresult-duo
          # An .xcresult is a directory: upload-artifact matches files only, so the trailing /** names the files inside.
          # apple/.build is hidden, and upload-artifact v4.4+ skips hidden files unless told otherwise.
          include-hidden-files: true
          path: |
            apple/.build/uitest-duo.xcresult/**
            apple/.build/uitest-duo.log
          if-no-files-found: ignore
      - name: Keep the ipad results
        if: ${{ !cancelled() && (steps.ipad.outcome == 'failure' || steps.ipad_journeys.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcresult-ipad
          # An .xcresult is a directory: upload-artifact matches files only, so the trailing /** names the files inside.
          # apple/.build is hidden, and upload-artifact v4.4+ skips hidden files unless told otherwise.
          include-hidden-files: true
          path: |
            apple/.build/uitest-ipad.xcresult/**
            apple/.build/uitest-ipad.log
          if-no-files-found: ignore
      - name: Save DerivedData (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-sim-arm64-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
      - name: Save SwiftPM caches (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-test-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}

  build-release:
    # The Release build runs on a push to main only; a pull request is covered by the macOS job's build and swift test.
    needs: scope
    if: ${{ vars.HOSTED_MACOS == 'on' && needs.scope.outputs.release == 'true' && github.event_name == 'push' }}
    runs-on: ${{ (startsWith(vars.HOSTED_XCODE_LABEL, 'xcode-') || startsWith(vars.HOSTED_XCODE_LABEL, 'macos-')) && vars.HOSTED_XCODE_LABEL || 'xcode-27' }}
    timeout-minutes: 90
    env:
      FENTON_CI_HOSTED: "1"
      DEVELOPER_DIR: ${{ vars.HOSTED_DEVELOPER_DIR || '/Applications/Xcode_27.1.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Derived data path (runner context is not allowed in job env)
        run: echo "DERIVED=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
      - name: Prepare the runner
        run: tools/ci_hosted_setup.sh
      - name: Selected Xcode (cache key)
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Restore DerivedData
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-
      - name: Release build (generic iOS, unsigned)
        run: |
          set -euo pipefail
          cd apple
          xcodegen generate --quiet
          xcodebuild build -project FentonHome.xcodeproj -scheme FentonHome -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO
      - name: Save DerivedData (main only)
        if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: dd-release-${{ steps.xcode.outputs.version }}-${{ hashFiles('apple/Package.resolved') }}-${{ github.sha }}

  pr-checks:
    # The one check GitHub requires. A job that was skipped passes only when it was allowed to (tools/ci_aggregate.py): scope-gated
    # jobs, hosted macOS while HOSTED_MACOS is off, the denylist scan on a fork PR. The Smoke steps of the macos job are advisory.
    if: always()
    needs: [scope, linux-checks, tool-tests-core, denylist-scan, macos, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Author check
        # GitHub is the merge gate: only SFenton's own branches in this repository merge. A fork pull request, or one from another
        # account, fails the aggregate (and so the required check) however green the rest is.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$AUTHOR" != "SFenton" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "pr-checks failed: pull request by $AUTHOR from $HEAD_REPO; only SFenton's branches in $THIS_REPO merge" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Aggregate
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          HOSTED_MACOS: ${{ vars.HOSTED_MACOS }}
          EVENT: ${{ github.event_name }}
        run: python3 tools/ci_aggregate.py | tee -a "$GITHUB_STEP_SUMMARY"

  report-red-main:
    # A red tool-test run on main files (or updates) one issue labelled Workflow, so it cannot go unseen. A push to main only. A manual
    # run reaches it only with report_dry_run, and then only prints the issue (it runs even when the tests are green); a manual run
    # never files one.
    needs: [linux-checks, tool-tests-core]
    if: ${{ always() && ((github.event_name == 'push' && contains(needs.*.result, 'failure')) || (github.event_name == 'workflow_dispatch' && inputs.report_dry_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true   # a green dry run has no logs
        with:
          pattern: tool-tests-log-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true
      - name: File or update the Workflow issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only a push to main files; every other event prints, whatever the input says.
          DRY_RUN: ${{ github.event_name != 'push' && 'true' || 'false' }}
          REPO: ${{ github.repository }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job, so gh needs the repository named
        run: |
          failing="$(cat "$RUNNER_TEMP"/logs/*.log 2>/dev/null | grep -E '^(FAIL|ERROR): ' | sort -u | head -40 || true)"
          [ -n "$failing" ] || failing="(no failing test ids in the logs; see the run)"
          fence="$(printf '\140\140\140')"
          body="$(printf 'The full tool suite is red on %s at %s.\n\nRun: %s\n\nFailing tests:\n\n%s\n%s\n%s\n' "$BRANCH" "$HEAD_SHA" "$RUN_URL" "$fence" "$failing" "$fence")"
          title="Tool tests red on ${BRANCH}"
          if [ "$DRY_RUN" = "true" ]; then
            { echo "Dry run: would file or update the issue \"$title @ ${HEAD_SHA:0:10}\" (label Workflow) in $REPO with:"; echo; echo "$body"; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create Workflow --color 5319e7 --description "How the agents work" 2>/dev/null || true
          number="$(gh issue list --state open --label Workflow --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$title\"))][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            gh issue edit "$number" --title "$title @ ${HEAD_SHA:0:10}"
          else
            gh issue create --label Workflow --title "$title @ ${HEAD_SHA:0:10}" --body "$body"
          fi
