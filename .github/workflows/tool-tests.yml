name: tool-tests
# The safety net behind right-sized landing (owner, 2026-11-04): lanes land on the workflow base with the core set and the
# tests their diff reaches, so the whole Python tool suite runs here after every push to main. A red run files
# (or updates) one issue labelled Workflow that names the failing head SHA and tests, so it cannot go unseen.
# The `tool-tests-hosted` matrix (core, triage, release in parallel on Linux) runs the suite; `report-hosted` files the Workflow issue.
# Documentation: .agents/workflow/agent-roster.md ("What code enforces today"), .agents/workflow/pr-lifecycle.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tool-tests-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  tool-tests-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [core, triage, release]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python tool tests (${{ matrix.part }}; the full suite on main, red failures are listed in the issue)
        run: |
          set -o pipefail
          tools/run_tool_tests.sh "${{ matrix.part }}" 2>&1 | tee "$RUNNER_TEMP/tool-tests-${{ matrix.part }}.log"
      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tool-tests-log-${{ matrix.part }}
          path: ${{ runner.temp }}/tool-tests-${{ matrix.part }}.log

  report-hosted:
    permissions:
      contents: read
      issues: write
      actions: read
    # One issue per red run, not one per part: the parts upload their logs and this job files or updates the Workflow issue.
    needs: tool-tests-hosted
    if: ${{ always() && needs.tool-tests-hosted.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: tool-tests-log-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true
      - name: File or update the Workflow issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failing="$(cat "$RUNNER_TEMP"/logs/*.log 2>/dev/null | grep -E '^(FAIL|ERROR): ' | sort -u | head -40 || true)"
          [ -n "$failing" ] || failing="(no failing test ids in the logs; see the run)"
          body="$(printf 'The full tool suite is red on %s at %s.\n\nRun: %s\n\nFailing tests:\n\n```\n%s\n```\n' "$BRANCH" "$HEAD_SHA" "$RUN_URL" "$failing")"
          title="Tool tests red on ${BRANCH}"
          gh label create Workflow --color 5319e7 --description "How the agents work" 2>/dev/null || true
          number="$(gh issue list --state open --label Workflow --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$title\"))][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            gh issue edit "$number" --title "$title @ ${HEAD_SHA:0:10}"
          else
            gh issue create --label Workflow --title "$title @ ${HEAD_SHA:0:10}" --body "$body"
          fi
