<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile rollout: Settings and more · proposal</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<script src="../../_kit/kit.js"></script>
<script src="../../pages/settings/_household-forms.js"></script>
<script src="../../pages/vacation/_vacation-sprinklers.js"></script>
<script src="../../pages/sprinklers/_vacation-sprinklers.js"></script>
<script src="../../pages/chores/_chores.js"></script>
<script src="../../modals/room-devices/_devices-vacuums.js"></script>
<script src="../../modals/vacuums/_devices-vacuums.js"></script>
<script src="../action-navigation-tiles/_action-tiles.js"></script>
<script src="../selection-tiles/_selection.js"></script>
<script src="_rollout.js"></script>
</head><body>
<script>
(function () {
  var h = Mock.h, K = Mock.components, RO = Mock.ro, SEL = Mock.sel, HF = window.HF, V = Mock.VS.V, VC = V.copy, SP = Mock.VS.S, vac = Mock.dv.vac, Chores = window.Chores;
  var G = HF.GREEN, CT = HF.CONTROL;

  function seq(steps) { return steps.reduce(function (p, s) { return p.then(s); }, Promise.resolve()); }
  function hold(ms) { return function () { return Mock.sleep(ms); }; }
  function box(kids) { return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', maxWidth: '78ch' } }, kids); }
  function table(head, rows, shade) {
    return h('div.k-table-wrap', h('table.ro-cmp', h('thead', h('tr', head.map(function (x, i) { return h('th' + (shade === i ? '.c' : ''), x); }))),
      h('tbody', rows.map(function (r) { return h('tr', r.map(function (x, i) { return h('td' + (shade === i ? '.c' : ''), x); })); }))));
  }
  function spage(ctx, key, body) { return Mock.page(ctx, { title: HF.PAGES[key].title, section: 'settings', back: 'Settings', badge: 3, choresBadge: 2, body: [HF.col(body)] }); }

  /* ================================================================== 18-22 Admin */
  var ROOMS = HF.ROOMS, ON = { 'Living Room': 1, 'Kitchen': 1, 'Bedroom 1': 1, 'Bathroom 1': 1, 'Office': 1, 'Hallway': 1 };
  /** A settings switch as an action tile: text, power disc (green family, the Settings tint). */
  function pwr(title, on, un, disc) {
    return RO.act({ title: title, sub: un ? 'Unavailable' : (on ? 'On' : 'Off'), tint: G, active: on && !un, unavailable: un, disc: disc || 'power', discOn: on && !un, label: title });
  }
  function admin(ctx, mode, un) {
    var S = HF.section;
    return spage(ctx, 'admin', [
      S('security', RO.pair(mode, { today: [HF.tile({ title: 'Front Door Auto-Lock', symbol: 'lock.shield', on: true, unavailable: un }), HF.tile({ title: 'Front Door Auto-Lock', symbol: 'lock.shield', on: false, unavailable: un })],
        prop: [pwr('Front Door Auto-Lock', true, un, 'lock.fill'), pwr('Front Door Auto-Lock', false, un, 'lock.open')] }, { min: 240, max: 2 })),
      S('power', RO.pair(mode, { today: [K.GlassTile({ title: 'Attempt to turn power back on', symbol: 'bolt.fill', tint: G, isActive: true, kind: 'command' }),
          K.GlassTile({ title: 'Attempt to turn power back on', subtitle: 'Didn\'t Respond', symbol: 'bolt.fill', tint: G, isActive: true, isError: true, kind: 'command' })],
        prop: [RO.act({ title: 'Attempt to turn power back on', tint: G, active: true, disc: 'bolt.fill', momentary: true, label: 'Run power recovery' }),
          RO.act({ title: 'Attempt to turn power back on', sub: 'Didn\'t Respond', tint: G, active: true, error: true, disc: 'bolt.fill', momentary: true, label: 'Run power recovery' })] }, { min: 240, max: 2 })),
      S('relay', [RO.pair(mode, { today: [HF.tile({ title: 'Relay Control Mode', symbol: 'switch.2', on: false, unavailable: un }), HF.tile({ title: 'Relay Control Mode', symbol: 'switch.2', on: true, unavailable: un })],
        prop: [pwr('Relay Control Mode', false, un), pwr('Relay Control Mode', true, un)] }, { min: 240, max: 2 }),
        K.InlineAlert({ message: HF.COPY.warning }), RO.note('The warning shows while Relay Control Mode and Guest Room guest mode are both on (unchanged).')]),
      S('show', RO.pair(mode, { today: [HF.tile({ title: 'Outdoor Faucets', symbol: 'drop', on: true, unavailable: un }), HF.tile({ title: 'Holiday Lights', symbol: 'sparkles', on: false, unavailable: un })],
        prop: [pwr('Outdoor Faucets', true, un), pwr('Holiday Lights', false, un)] }, { min: 200, max: 2 })),
    ]);
  }
  function autoReset(ctx, mode, un) {
    var today = ROOMS.map(function (r) { return HF.tile({ title: r[0], symbol: 'arrow.triangle.2.circlepath', on: !!ON[r[0]], unavailable: un }); });
    var prop = ROOMS.map(function (r) { return pwr(r[0], !!ON[r[0]], un); });
    return Mock.sheet(ctx, { title: 'Presence Auto-Reset', detent: 'large', size: 'page', trailing: 'close',
      content: h('div', { style: { padding: '8px 0 0' } }, RO.pair(mode, { today: today, prop: prop }, { min: 150, max: 4 })) });
  }

  /* ================================================================== 23 High AQI, 24 Guests */
  var AQI = { title: 'Turn On High AQI Mode?', message: 'This changes every air purifier in the house.', confirm: 'Turn On' };
  function aqiTiles(on, un) { return { today: [HF.tile({ title: 'High AQI Mode', symbol: 'air.purifier', on: on, unavailable: un })], prop: [pwr('High AQI Mode', on, un)] }; }
  function aqi(ctx, mode, un) {
    var a = aqiTiles(false, un), b = aqiTiles(true, un);
    return spage(ctx, 'special-device-modes', [HF.section('aqi', RO.pair(mode, { today: a.today.concat(b.today), prop: a.prop.concat(b.prop) }, { min: 240, max: 2 }))]);
  }
  function aqiAlert(ctx, turningOn) {
    var t = turningOn ? aqiTiles(false) : aqiTiles(true);
    var page = spage(ctx, 'special-device-modes', [HF.section('aqi', RO.pair('prop', { prop: t.prop }, { min: 240, max: 2 }))]);
    return RO.alertOver(page, turningOn ? AQI : { title: 'Turn Off High AQI Mode?', message: AQI.message, confirm: 'Turn Off' }, ctx);
  }
  /** Guest Controls drawn like the Home page's guest tiles (occupancy family, power disc, "Guests staying"). */
  function guestTile(title, on, un) {
    return RO.act({ title: title, sub: un ? 'Unavailable' : (on ? 'Guests staying' : 'No guests'), family: 'occupancy', active: on && !un, unavailable: un, disc: 'power', discOn: on && !un, label: title });
  }
  function guests(ctx, mode, un) {
    var rooms = [['Guest Room', 'bed.double', true], ['Studio', 'guitars', false], ['Media Room', 'videoprojector', false]];
    return spage(ctx, 'guests', [HF.section('guests', RO.pair(mode, {
      today: rooms.map(function (r) { return HF.tile({ title: r[0], symbol: r[1], on: r[2], unavailable: un }); }),
      prop: rooms.map(function (r) { return guestTile(r[0], r[2], un); }) }, { min: 150, max: 6 }))]);
  }

  /* ================================================================== 25 car (sub-choice) */
  function doors(state) {
    var m = {
      locked: { sub: 'Locked', active: false, disc: 'lock.fill', on: false, label: 'Unlock' },
      unlocking: { sub: 'Unlocking…', active: true, disc: 'lock.open', on: true, busy: true, label: 'Unlocking' },
      unlocked: { sub: 'Unlocked', active: true, disc: 'lock.open', on: true, label: 'Lock' },
      jammed: { sub: 'Jammed', error: true, disc: 'lock.trianglebadge.exclamationmark', on: true, label: 'Lock' },
      unavailable: { sub: 'Unavailable', unavailable: true, disc: 'lock.fill', on: false, label: 'Unlock' },
    }[state];
    return RO.act({ title: 'Doors', sub: m.sub, tint: CT, active: !!m.active, error: !!m.error, unavailable: !!m.unavailable, disc: m.disc, discOn: !!m.on && !m.error, busy: !!m.busy, label: m.label });
  }
  function machTiles(doorsNode) {
    return [HF.stateTile({ title: 'Charge Status', symbol: 'ev.charger', subtitle: 'Plugged In', active: false }), doorsNode,
      HF.stateTile({ title: 'Driver\'s Seat', symbol: 'carseat.left', subtitle: 'Off', active: false }), HF.stateTile({ title: 'Passenger Seat', symbol: 'carseat.left', subtitle: 'Heat', active: true }),
      HF.stateTile({ title: 'Climate', symbol: 'windshield.front.and.heat.waves', subtitle: '72', active: false })];
  }
  function machBody(rows) {
    return h('section.ui-settings', { style: { gap: '8px' } }, h('h3', { role: 'heading', 'aria-level': '2' }, 'Charge Status'), RO.stack(rows));
  }
  function vehicle(ctx, states) {
    var rows = [{ label: 'Today · option A: keep read-only', kind: 'today', tiles: machTiles(HF.stateTile({ title: 'Doors', symbol: 'lock', subtitle: 'Locked', active: false })), min: 150, max: 4 },
      { label: 'Option B: Doors acts', kind: 'prop', tag: 'RECOMMENDED', tiles: machTiles(doors('locked')), min: 150, max: 4 }];
    if (states) rows.push({ label: 'Option B: every Doors state', kind: 'prop', tiles: ['locked', 'unlocking', 'unlocked', 'jammed', 'unavailable'].map(doors), min: 150, max: 4,
      note: 'Locked, Unlocking (arc in the disc), Unlocked (filled, white disc), Jammed (red, a different glyph), Unavailable (dims in place). Same states as the Security page tile.' });
    return spage(ctx, 'car', [machBody(rows)]);
  }

  /* ================================================================== 26 Chores quick links (sub-choice) */
  function aSub(l, zero) {
    var c = zero ? { total: 0, overdue: 0 } : Chores.counts(l.page);
    if (l.grocery) return c.total ? c.total + (c.total === 1 ? ' item' : ' items') : 'No groceries listed';
    return c.total ? c.total + ' open' + (c.overdue ? ' · ' + c.overdue + ' overdue' : '') : 'Nothing open';
  }
  /** variant: 'today' | 'A' (count in the subtitle) | 'B' (count badge beside the chevron). */
  function links(o, variant) {
    var sec = Chores.quickLinks(o);
    if (variant === 'today') return sec;
    var viewer = o.viewer === undefined ? 'alex' : o.viewer;
    Array.prototype.slice.call(sec.querySelectorAll('.cz-ql')).forEach(function (w, i) {
      var l = Chores.LINKS[i], title = Chores.linkTitle(l, viewer), count = o.zero ? 0 : Chores.counts(l.page).total, tile;
      if (variant === 'A') tile = RO.nav({ title: title, sub: aSub(l, o.zero), symbol: l.symbol, family: l.family, active: true });
      else {
        tile = RO.nav({ title: title, sub: Chores.subtitle(l.page, o.zero), symbol: l.symbol, family: l.family, active: true, accessory: count ? h('span.ro-ct', { 'aria-hidden': 'true' }, String(count)) : null, accessoryWidth: 58 });
        if (count) tile.classList.add('ro-ct-t');
      }
      w.textContent = ''; w.appendChild(tile);
    });
    return sec;
  }
  function chores(ctx, o) {
    function titled(variant, label, kind, tag) {
      var s = links(o, variant), hd = s.firstChild; if (hd) s.removeChild(hd);
      return h('div.ro-pair', RO.cap(label, kind, tag), s);
    }
    return Mock.page(ctx, { title: 'Chores', section: 'chores', badge: 3, choresBadge: 3, body: [
      h('div.ro-gap', [titled('today', 'Today: numeral top-trailing, subtitle spells the split', 'today'),
        titled('A', 'Placement A: count in the subtitle', 'prop', { text: 'RECOMMENDED' }),
        titled('B', 'Placement B: count badge beside the chevron', 'prop', { text: 'ALTERNATIVE', alt: true })])] });
  }

  /* ================================================================== 27 Vacation Mode, 28-29 Solo Trip */
  function vacTile(kind, o) {
    var on = !!o.on, pend = !!o.pending, enabled = on || pend, sub = pend ? 'Pending' : o.unavailable ? 'Unavailable' : on ? 'On' : 'Off', tint = pend ? V.tint.pending : V.tint.vacation;
    if (kind === 'today') return K.GlassTile({ title: VC.modeTitle, subtitle: sub, symbol: 'airplane', tint: tint, isActive: enabled, isUnavailable: !!o.unavailable, kind: 'toggle' });
    return RO.act({ title: VC.modeTitle, sub: sub, tint: tint, active: enabled, unavailable: !!o.unavailable, disc: 'power', discOn: enabled, label: VC.modeTitle });
  }
  function vacation(ctx, mode, o) {
    o = o || {};
    var page = Mock.page(ctx, { title: VC.modeTitle, back: 'Settings', section: 'settings', badge: 3, choresBadge: 2, body: V.modeBody(ctx, o) });
    var tile = page.querySelector('.ui-tile');
    var states = o.both ? [{ on: false }, { on: true }] : [o];
    tile.replaceWith(RO.pair(mode, { today: states.map(function (s) { return vacTile('today', s); }), prop: states.map(function (s) { return vacTile('prop', s); }) }, { min: 240, max: 1 }));
    return page;
  }
  function vacationSheet(ctx) {
    var f = [{ label: VC.starts, value: V.when.now }, { label: VC.ends, value: V.when.plus1 }];
    return Mock.sheet(ctx, { title: VC.confirmTitle, detent: 'fitted', size: 'form', leading: 'cancel', trailing: 'none',
      content: h('div.vs-stack', V.dateFields({ fields: f }), V.actionButton(VC.confirmAction, { prominent: true })),
      presenter: vacation(ctx, 'prop', { pending: true, checks: [true, true, true, true, true] }) });
  }
  function vacationAlert(ctx) {
    return RO.alertOver(vacation(ctx, 'prop', { on: true }), { title: VC.disableTitle, message: VC.disableMessage, confirm: VC.disableConfirm }, ctx);
  }

  function soloToggle(kind, on, sel) {
    var sub = on ? 'On' : sel ? 'Off' : VC.toggleDisabled;
    if (kind === 'today') { var t = K.GlassTile({ title: VC.soloTitle, subtitle: sub, symbol: 'suitcase', tint: V.tint.solo, isActive: on, kind: 'toggle' }); if (!on && !sel) t.classList.add('vs-muteglyph'); return t; }
    return RO.act({ title: VC.soloTitle, sub: sub, tint: V.tint.solo, active: on, disc: 'power', discOn: on, dim: !on && !sel, label: VC.soloTitle });
  }
  function travelerToday(name, mine, trip) {
    return K.GlassTile({ title: name, subtitle: trip ? (mine ? 'Away' : 'Home') : undefined, symbol: mine ? 'figure.walk.departure' : (trip ? 'house' : 'person'), tint: V.tint.solo, isActive: mine, kind: 'selection', selected: mine });
  }
  function travelerProp(id, name, mine, trip) {
    var c = { family: 'occupancy', multi: false, one: trip ? 'Away' : null };   /* the family gives the filled selected face; tintSel restates it in Solo Trip's own blue */
    var t = RO.tag(RO.tintSel(SEL.tile('C', { id: id, title: name, sel: mine }, c), V.tint.solo), { n: 1, carry: true, max: 'Home' });
    if (trip && !mine) t.querySelector('.tx').appendChild(h('span.st', 'Home'));
    return t;
  }
  function solo(ctx, mode, o) {
    o = o || {};
    var tg = o.both ? [false, true] : [!!o.trip];
    var toggles = RO.pair(mode, { today: tg.map(function (on) { return soloToggle('today', on, true); }), prop: tg.map(function (on) { return soloToggle('prop', on, true); }) }, { min: 240, max: 1 });
    var trav = RO.pair(mode, { today: [travelerToday('Alex', true, !!o.trip), travelerToday('Sam', false, !!o.trip)],
      prop: [travelerProp('alex', 'Alex', true, !!o.trip), travelerProp('sam', 'Sam', false, !!o.trip)] }, { min: 140, max: 2 });
    var a = V.section({ content: [h('p.vs-desc', VC.soloDescription), toggles] });
    var b = V.section({ title: VC.awayTitle, description: VC.awayDescription, content: [trav] });
    return Mock.page(ctx, { title: VC.soloTitle, back: 'Settings', section: 'settings', badge: 3, choresBadge: 2, body: [V.grid([a, b])] });
  }
  function soloEditor(ctx) {
    var f = [{ label: VC.departs, value: V.when.now }, { label: VC.returns, value: V.when.plus3 }];
    return Mock.sheet(ctx, { title: VC.editorTitle, detent: 'fitted', size: 'form', leading: 'cancel', trailing: 'none',
      content: h('div.vs-stack', h('p.vs-desc', { style: { margin: 0, fontSize: 'var(--fs-sub)', color: 'var(--ink-sheet-2)' } }, VC.editorDescription), K.ScheduleDateFields({ fields: f }), V.actionButton(VC.editorConfirm, { prominent: true })),
      presenter: solo(ctx, 'prop', { trip: false }) });
  }
  function soloEnd(ctx) {
    return RO.alertOver(solo(ctx, 'prop', { trip: true }), { title: 'End Solo Trip?', message: 'The house goes back to its normal automations right away.', confirm: 'End Solo Trip' }, ctx);
  }

  /* ================================================================== 30 Sprinklers */
  function sprinklerTile(s) {
    var watering = s.status === 'watering', un = s.status === 'unavailable';
    return RO.nav({ title: s.title, sub: SP.fmt.subtitle(s), symbol: 'sprinkler.and.droplets', family: 'water', active: watering, unavailable: un,
      actions: [{ id: 'stop', symbol: 'stop.fill', label: 'Stop Watering', dim: !watering }] });
  }
  /** The card with the tile in place of the module row; the four status pills stay as a module under it. */
  function sprinklerCard(s) {
    var old = SP.card(s), pills = old.querySelector('.vs-pills'), warn = old.querySelector('.ui-inline-alert'), kids = [];
    if (warn) kids.push(warn);
    kids.push(sprinklerTile(s));
    kids.push(K.ModuleList({ density: s.batteryLow ? 'dense' : 'thin', rows: [pills] }));
    return h('div.vs-cardwrap', { role: 'group', 'aria-label': s.title, style: { display: 'flex', flexDirection: 'column', gap: '8px' } }, kids);
  }
  function sprinklers(ctx, mode, snaps) {
    snaps = snaps || [SP.snap('frontYard'), SP.snap('backyard')];
    function grid(f) { return K.TileGrid({ min: Mock.VS.fit(340, Mock.VS.pageW()), max: 2, gap: 24, equal: false, items: snaps.map(f) }); }
    var kids = [];
    if (mode !== 'prop') { kids.push(RO.cap('Today: the module row has no chevron and no action', 'today')); kids.push(grid(function (s) { return SP.card(s); })); }
    if (mode !== 'today') { kids.push(RO.cap('Proposed: navigation tile, chevron, Stop Watering disc', 'prop')); kids.push(grid(sprinklerCard)); }
    return Mock.page(ctx, { title: 'Sprinklers', back: 'Home', section: 'home', badge: 3, choresBadge: 2, body: [h('div.ui-section', { style: { gap: '12px' } }, K.PageSectionHeader({ title: 'Controllers' }), h('div.ro-pair', kids))] });
  }

  /* ================================================================== 31 Vacuums page, 32-33 vacuum sheet */
  var SYM = { cleaning: 'sparkles', docked: 'house', returning: 'arrow.uturn.left.circle', paused: 'pause.circle', error: 'exclamationmark.circle' };
  function robotProp(key, sc) {
    var R = vac.ROBOTS[key], v = vac.V({ robot: key, scenario: sc }), st = v.state, sub = vac.stateLabel(v) + ' • ' + v.battery + '%';
    return RO.nav({ title: R.title, sub: sub, symbol: SYM[st], family: 'cleaning', active: ['cleaning', 'returning', 'paused'].indexOf(st) >= 0, progress: st === 'cleaning' ? v.battery / 100 : undefined,
      actions: [{ id: 'startpause', symbol: st === 'cleaning' ? 'pause.fill' : 'play.fill', label: st === 'cleaning' ? 'Pause' : st === 'paused' ? 'Resume' : 'Start' },
        { id: 'dock', symbol: 'house.fill', label: 'Dock', dim: st === 'docked' }] });
  }
  function vacuums(ctx, mode) {
    var sc = [['main', 'docked'], ['music', 'cleaning'], ['theater', 'paused']];
    var body = RO.pair(mode, { today: sc.map(function (x) { return vac.robotTile(x[0], x[1]); }), prop: sc.map(function (x) { return robotProp(x[0], x[1]); }) }, { min: 150, max: 6 });
    return Mock.page(ctx, { title: 'Vacuums', back: 'Home', section: 'home', badge: 3, choresBadge: 2, body: [h('div.ui-section', { style: { gap: '8px' } }, K.PageSectionHeader({ title: 'Robot Vacuums' }), body,
      RO.note('Main Floor docked (Dock dims), Studio cleaning, Media Room paused. Start/Pause and Dock are the same two discs the room-page vacuum tile has.'))] });
  }

  var ZONES = ['living_room', 'bedroom_1', 'kitchen', 'office', 'hallway', 'guest_room'], PICK = ['living_room', 'kitchen', 'office'];
  function roomItems(order) { return ZONES.map(function (id) { var i = order.indexOf(id); return { id: id, title: vac.zoneTitle(id), order: i >= 0 ? i + 1 : 0 }; }); }
  function roomsSheet(ctx, mode, order) {
    var c = { family: 'cleaning', multi: true };
    var today = h('div.vc-rooms.two', { role: 'group', 'aria-label': 'Rooms' }, ZONES.map(function (id) { var i = (order || PICK).indexOf(id); return vac.roomCard(id, { order: i >= 0 ? i + 1 : null }); }));
    var prop = RO.grid(roomItems(order || PICK).map(function (it) { return RO.tag(SEL.tile('C', it, c), { n: 1, carry: true, max: 'Not included' }); }), 150, 2);
    var kids = [vac.desc('Rooms are cleaned in the order you select them. The numbered badges show the cleaning sequence.')];
    if (mode !== 'prop') kids.push(RO.cap('Today: white card with a black order badge', 'today'), today);
    if (mode !== 'today') kids.push(RO.cap('Proposed: selected face, numbered disc (tap order); the number is the disc', 'prop'), prop);
    return Mock.sheet(ctx, { title: 'Main Floor Robot Vacuum', subtitle: 'Docked · 87%', detent: 'large', size: 'page', trailing: 'close', content: h('div.vc-gap12', { style: { padding: '8px 0 0' } }, kids) });
  }
  /** The Selected Rooms / Full Clean card: today's row in its module beside a navigation tile with a chevron. */
  function selectedBlock(ctx, picked) {
    var v = vac.V({ robot: 'main', scenario: 'docked', selected: picked });
    var todayBlock = vac.controls(v, ctx).querySelector('.vc-selrow').closest('.vc-gap12');
    var chips = picked.length ? h('div.vc-flow', picked.map(function (id, i) { return vac.orderChip(i + 1, vac.zoneTitle(id)); })) : null;
    var tile = RO.nav({ title: picked.length ? 'Selected Rooms' : 'Full Clean', sub: picked.length ? null : 'Every mapped area', symbol: picked.length ? 'sparkles' : 'robotic.vacuum', family: 'cleaning', active: picked.length > 0, under: chips });
    var propBlock = vac.controls(v, ctx).querySelector('.vc-selrow').closest('.vc-gap12');
    var row = propBlock.querySelector('.vc-selrow'), list = row.parentNode, kids = [tile];
    if (!picked.length) kids.push(K.InlineAlert({ message: 'No rooms are selected, and no areas are drawn. If you begin cleaning, the robot vacuum will attempt to clean every mapped area.' }));
    row.remove();
    propBlock.insertBefore(h('div.ro-gap', kids), propBlock.firstChild);
    return h('div.ro-gap', [RO.cap(picked.length ? 'Selected Rooms: today' : 'Full Clean: today', 'today'), todayBlock, RO.cap(picked.length ? 'Selected Rooms: proposed (opens the Rooms section)' : 'Full Clean: proposed (opens the Rooms section)', 'prop'), propBlock]);
  }
  function selectedSheet(ctx) {
    return Mock.sheet(ctx, { title: 'Main Floor Robot Vacuum', subtitle: 'Docked · 87%', detent: 'large', size: 'page', trailing: 'close',
      content: h('div.vc-col', { style: { padding: '8px 0 0' } }, [selectedBlock(ctx, PICK), selectedBlock(ctx, [])]) });
  }

  /* ================================================================== sections */
  var ITEMS = [
    ['18', 'Admin · Front Door Auto-Lock', 'Green toggle tile, leading glyph', 'Action tile, <code>lock.fill</code> / <code>lock.open</code> disc', 'PowerToggleActions with a lock symbol'],
    ['19', 'Admin · Relay Control Mode', 'Toggle tile', 'Action tile, <code>power</code> disc', 'PowerToggleActions'],
    ['20', 'Admin · Outdoor Faucets, Holiday Lights', 'Toggle tiles', 'Action tiles, <code>power</code> disc', 'PowerToggleActions'],
    ['21', 'Admin · Attempt to turn power back on', 'Command tile', 'Momentary action tile, <code>bolt.fill</code> disc; keeps "Didn\'t Respond"', 'new CommandActions (momentary)'],
    ['22', 'Presence Auto-Reset sheet · 14 rooms', 'Toggle tiles', 'Action tiles, <code>power</code> disc', 'PowerToggleActions ×14'],
    ['23', 'Special Device Modes · High AQI Mode', 'Toggle tile + alert', 'Action tile, <code>power</code> disc; the alert stays (drawn)', 'PowerToggleActions + confirm'],
    ['24', 'Guest Controls · 3 guests', 'Toggle tiles', 'Action tiles, <code>power</code> disc, the Home page versions', 'PowerToggleActions (already built on Home)'],
