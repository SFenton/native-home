<script>
(function () {
  var h = Mock.h, RO = Mock.ro, AT = Mock.at, SEL = Mock.sel, K = Mock.components, T = RO.T, D = RO.D, pwr = RO.pwr;
  var I = Mock.icon;

  /* ------------------------------------------------------------------ small helpers */
  function seq(steps) { return steps.reduce(function (p, s) { return p.then(s); }, Promise.resolve()); }
  function hold(ms) { return function () { return Mock.sleep(ms); }; }
  var TODAY = [['Today', 'today']], PROP = [['Proposed', 'prop']], REC = [['Proposed', 'prop'], ['Recommended', 'rec']];
  function choice(letter, rec) { var t = [['Owner choice ' + letter, 'choice']]; if (rec) t.push(['Recommended', 'rec']); return t; }
  function grid(tiles, o) { return RO.grid(tiles, o); }
  function section(title, tiles, o) { return RO.sub([RO.hdr(title), grid(tiles, o)]); }
  function full(t) { t.style.gridColumn = '1 / -1'; return t; }
  function noSel(tiles) { tiles.forEach(function (t) { delete t._sel; }); return tiles; }
  function table(head, rows) {
    return h('div.k-table-wrap', h('table.ro-tbl', h('thead', h('tr', head.map(function (x) { return h('th', x); }))),
      h('tbody', rows.map(function (r) { return h('tr' + (r.choice ? '.choice' : ''), r.cells.map(function (x, i) { return h('td' + (i === 0 ? '.n' : ''), x); })); }))));
  }

  /* ------------------------------------------------------------------ shared tiles (data from the atlas fixtures and RoomsConfig) */
  function vents(o) { o = o || {}; var closed = !!o.closed; return T({ k: 'nav', t: 'Vents', s: closed ? 'Closed' : 'Open', sym: 'aqi.medium', fam: 'vents', on: !closed, acts: o.disc ? [closed ? D('fan.slash', 'Open Vents', false) : D('fan', 'Close Vents', true)] : null, wide: !!o.disc }); }
  function purifier(o) {
    o = o || {}; var on = o.on !== false, u = !!o.u, withDisc = o.disc !== false;
    return T({ k: 'nav', t: 'Air Purifier', s: u ? 'Unavailable • Unavailable' : 'Auto • ' + (on ? 'On' : 'Off'), sym: 'fan', fam: 'air', on: on && !u, u: u,
      acts: withDisc ? [pwr('Air Purifier', on && !u, u)] : null, wide: withDisc });
  }
  function humidifier(o) {
    o = o || {}; var on = o.on !== false, u = !!o.u, withDisc = o.disc !== false;
    return T({ k: 'nav', t: 'Humidifier', s: u ? 'Unavailable • Unavailable' : (on ? 'On' : 'Off') + ' • 44%', sym: 'humidifier', fam: 'water', on: on && !u, u: u,
      acts: withDisc ? [pwr('Humidifier', on && !u, u)] : null, wide: withDisc });
  }
  function bed(title, o) {
    o = o || {};
    var fam = o.fam || 'heating', off = !!o.off, ro = !!o.ro, on = !off && !ro;
    var s = ro ? 'Away · Read Only' : (off ? 'Off' : (o.sub || 'Heating • +3'));
    return T({ k: 'nav', t: title, s: s, sym: 'bed.double', fam: fam, on: on, acts: o.disc === false ? null : [pwr(title, on, ro)], wide: o.disc !== false });
  }
  function remote(title, sym, o) {
    o = o || {};
    return T({ k: 'nav', t: title, s: 'Off', sym: sym, fam: 'media', on: false, acts: [pwr(title, false)], wide: true });
  }
  var SRC = SEL.cases.sources;
  function srcItems(ids, selIds) {
    return ids.map(function (id) { var it = SRC.items.filter(function (x) { return x.id === id; })[0]; return Object.assign({}, it, { sel: selIds.indexOf(id) >= 0 }); });
  }
  function srcToday(items) { return items.map(function (it) { return T({ k: 'sel', t: it.title, s: it.sel ? 'On' : 'Off', sym: it.symbol, fam: 'media', on: it.sel, sel: it.sel }); }); }
  function srcNew(items) { return items.map(function (it) { return SEL.tile('C', it, SRC); }); }
  function device(title, sym, o) {
    o = o || {}; var on = !!o.on, u = !!o.u, s = u ? 'Unavailable' : (on ? 'On' : 'Off');
    return o.today ? T({ k: 'cmd', t: title, s: s, sym: sym, fam: 'media', on: on && !u, u: u })
      : T({ k: 'act', t: title, s: s, sym: sym, fam: 'media', on: on && !u, u: u, acts: [pwr(title, on && !u, u)] });
  }
  function sw(title, o) {
    o = o || {}; var on = !!o.on, u = !!o.u, s = u ? 'Unavailable' : (on ? 'On' : 'Off');
    return o.today ? T({ k: 'tog', t: title, s: s, sym: 'lightbulb', fam: 'lights', on: on && !u, u: u })
      : T({ k: 'act', t: title, s: s, sym: 'lightbulb', fam: 'lights', on: on && !u, u: u, acts: [pwr(title, on && !u, u)] });
  }
  function dim(title, pct, o) {
    o = o || {}; var u = !!o.u, on = pct > 0 && !u, s = u ? 'Unavailable' : (pct > 0 ? pct + '%' : 'Off'), p = on ? pct / 100 : undefined;
    return o.today ? T({ k: 'tog', t: title, s: s, sym: 'lightbulb', fam: 'lights', on: on, u: u, prog: p, pt: o.tint })
      : T({ k: 'act', t: title, s: s, sym: 'lightbulb', fam: 'lights', on: on, u: u, prog: p, pt: o.tint, acts: [pwr(title, on, u)] });
  }
  function roomLights(room, sub, count, o) {
    o = o || {}; var on = sub !== 'Off';
    return T({ k: 'nav', t: room, s: sub, sym: count > 1 ? 'lightbulb.2' : 'lightbulb', fam: 'lights', on: on, acts: o.disc ? [pwr(room + ' lights', on)] : null, wide: !!o.disc });
  }
  var SEC = { armed_home: ['shield.lefthalf.filled', 'var(--fam-sec-home-fill)', 'Armed Home'], armed_away: ['shield.fill', 'var(--fam-sec-away-fill)', 'Armed Away'], armed_night: ['moon.zzz', 'var(--fam-sec-night-fill)', 'Armed Night'],
    disarmed: ['shield.slash', 'var(--fam-sec-disarmed-fill)', 'Disarmed'], triggered: ['exclamationmark.shield', 'var(--fam-sec-triggered-fill)', 'Triggered'] };
  var ARM = { home: ['shield.lefthalf.filled', 'Arm Home'], away: ['shield.fill', 'Arm Away'], night: ['moon.zzz', 'Arm Night'] };
  function secTile(state, disc) {
    var s = SEC[state];
    return T({ k: 'nav', t: 'Security System', s: s[2], sym: s[0], fill: s[1], layout: 'stack', lines: 2, acts: disc ? [disc] : null, wide: !!disc });
  }
  function armDisc(mode) { return D(ARM[mode][0], ARM[mode][1], false); }
  function disarmDisc() { return D('shield.slash', 'Disarm', false); }

  /* ------------------------------------------------------------------ the 17 items */
  var ITEMS = [];
  function item(o) { ITEMS.push(o); return o; }

  item({ n: 1, key: '01-air-purifier', title: '1 · Room page Air Purifier', note: 'Living Room, Climate section (the same card is on the Music, Media Room, Office, Guest and Bedroom 1 pages). Navigation tile plus a Power disc.',
    render: function (ctx) {
      return RO.page(ctx, { title: 'Living Room', blocks: [
        RO.block({ tags: TODAY, note: 'A navigation tile (glyph, text, chevron). Power lives only inside the purifier sheet.', kids: [section('Climate', [vents(), purifier({ disc: false })])] }),
        RO.block({ tags: REC, note: 'Same navigation tile with a Power disc left of the chevron. It turns the purifier on or off without opening the sheet (the fan.*_levoit_purifier entity); the fan mode stays in the sheet. The tile takes two tracks so the name still fits.', kids: [section('Climate', [vents(), purifier()])] }),
        RO.block({ tags: PROP, label: 'Off and unavailable', note: 'Off draws the dark face and an off disc. Unavailable dims the tile and the disc in place; the tile still opens its sheet.', kids: [section('Climate', [purifier({ on: false }), purifier({ u: true })])] }),
      ] });
    } });

  item({ n: 2, key: '02-humidifier', title: '2 · Humidifier', note: 'Bedroom 1, Climate section. Navigation tile plus a Power disc (switch.demo_power_1).',
    render: function (ctx) {
      return RO.page(ctx, { title: 'Bedroom 1', blocks: [
        RO.block({ tags: TODAY, kids: [section('Climate', [vents(), purifier({ disc: false }), humidifier({ disc: false })])] }),
        RO.block({ tags: REC, note: 'The humidifier gets the same disc as the purifier, so the Climate section reads one way. The mist level, timer and schedules stay in the sheet.', kids: [section('Climate', [vents(), purifier(), humidifier()])] }),
        RO.block({ tags: PROP, label: 'Off and unavailable', kids: [section('Climate', [humidifier({ on: false }), humidifier({ u: true })])] }),
      ] });
    } });

  item({ n: 3, key: '03-vents-card', title: '3 · Vents card (owner choice)', note: 'Living Room, Climate section. The card is already a navigation tile (chevron, opens a sheet that lists each vent). The choice is whether it gets a disc.',
    render: function (ctx) {
      return RO.page(ctx, { title: 'Living Room', blocks: [
        RO.block({ tags: TODAY, note: 'A navigation tile. The sheet it opens lists Vent 1 and Vent 2 as read-only tiles (item 16).', kids: [section('Climate', [vents(), purifier({ disc: false })])] }),
        RO.block({ tags: choice('A', true), label: 'No disc', note: 'Keeps the card exactly as it is, now by rule: a navigation tile with no action. Web parity (the React dashboard only reads vents), and nothing on the server changes a vent from the app.', kids: [section('Climate', [vents(), purifier()])] }),
        RO.block({ tags: choice('B', false), label: 'Open / close disc', note: 'One disc opens or closes every vent in the room (fan when open, fan.slash when closed). It needs a new vent command (cover.open_cover / close_cover on each vent) that no screen sends today.', kids: [section('Climate', [vents({ disc: true }), vents({ disc: true, closed: true })])] }),
      ] });
    } });

  item({ n: 4, key: '04-beds', title: '4 · Alex\'s Bed / Sam\'s Bed', note: 'Bedroom 1, Bed section (tile titles read "Your Side" and the other resident\'s name). Navigation tile plus a Power disc. Turning off keeps today\'s confirmation: see the next state.',
    render: function (ctx) {
      return RO.page(ctx, { title: 'Bedroom 1', blocks: [
        RO.block({ tags: TODAY, kids: [section('Bed', [bed('Your Side', { disc: false }), bed('Sam\'s Side', { fam: 'cooling', sub: 'Cooling • -3', disc: false })])] }),
        RO.block({ tags: REC, note: 'Power disc left of the chevron on each side. Turning a side on sends set_power at once; turning it off asks first (state 4b).', kids: [section('Bed', [bed('Your Side'), bed('Sam\'s Side', { fam: 'cooling', sub: 'Cooling • -3' })])] }),
        RO.block({ tags: PROP, label: 'Off and read-only', note: 'Off: dark face, off disc; tapping the disc turns it on with no question. During a Solo Trip the traveler\'s side is read-only ("Away · Read Only"): the disc dims, as the sheet\'s Turn Off capsule is hidden today.', kids: [section('Bed', [bed('Your Side', { off: true }), bed('Sam\'s Side', { fam: 'cooling', ro: true })])] }),
      ] });
    } });

  item({ n: 4, key: '04b-bed-off-confirm', title: '4b · Turning a bed off keeps its confirmation', note: 'The disc calls the same question the sheet\'s Turn Off capsule asks: "Turn off Alex\'s Bed?" (BedSideSheet.powerButton, a confirmationDialog). Action sheet on iPhone, popover on iPad and the unfolded Duo (drawn centred; the system anchors it to the disc).',
    render: function (ctx) {
      var dlg = K.ConfirmationDialog({ title: 'Turn off Alex\'s Bed?', buttons: [{ title: 'Turn Off', role: 'destructive' }, { title: 'Cancel', role: 'cancel' }], ctx: ctx });
      return RO.page(ctx, { title: 'Bedroom 1', overlay: dlg, blocks: [
        RO.block({ tags: REC, note: 'Tap the Power disc; the tile\'s body still opens the sheet. Turn On needs no question.', kids: [section('Bed', [bed('Your Side'), bed('Sam\'s Side', { fam: 'cooling', sub: 'Cooling • -3' })])] }),
      ] });
    } });

  item({ n: 5, key: '05-music-sources', title: '5 · Studio sources (room page)', note: 'Studio, Remote section: the remote leads, then Game Console, Server and Computer. Selected face with a check disc (selection-tiles option C).',
    render: function (ctx) {
      var ids = ['Game Console', 'server', 'pc'];
      return RO.page(ctx, { title: 'Studio', blocks: [
        RO.block({ tags: TODAY, note: 'Selection tiles: the chosen source fills media pink and reads On.', kids: [section('Remote', [remote('Studio Remote', 'appletvremote.gen4')].concat(srcToday(srcItems(ids, ['Game Console']))))] }),
        RO.block({ tags: REC, note: 'The chosen source keeps the filled face and gains a white check disc; the others show an empty ring. The leading glyph goes (an action or selection tile has none).', kids: [section('Remote', [remote('Studio Remote', 'appletvremote.gen4')].concat(srcNew(srcItems(ids, ['Game Console']))))] }),
        RO.block({ tags: PROP, label: 'Other sources, and none', note: 'Source is Server; then a TV input or Off, where no tile is selected. Tapping the checked tile runs today\'s toggle (xboxSourceToggle, serverToggle, windowsPCToggle): it turns the source off, so the ring returns.',
          kids: [RO.cap('Server is the source'), grid(noSel(srcNew(srcItems(ids, ['server'])))), RO.cap('No source selected'), grid(noSel(srcNew(srcItems(ids, []))))] }),
      ] });
    } });

  item({ n: 6, key: '06-theater-devices', title: '6 · Media Room Switch / streaming box (room page)', note: 'Media Room, Remote section. Action tile, text then disc, with the power glyph.',
    render: function (ctx) {
      var lead = remote('Media Room Remote', 'videoprojector');
      return RO.page(ctx, { title: 'Media Room', blocks: [
        RO.block({ tags: TODAY, note: 'Command tiles: tapping runs a script (media_room_nintendo_switch, media_room_tv_movie) and the tile reads On or Off from an input_boolean.', kids: [section('Remote', [lead, device('Handheld Console', 'gamecontroller', { today: true }), device('Media Room Streaming Box', 'tv', { today: true })])] }),
        RO.block({ tags: REC, note: 'Action tiles: no leading glyph, the power disc carries the state, the body does what the disc shows. Names wrap to two lines beside the disc.', kids: [section('Remote', [remote('Media Room Remote', 'videoprojector'), device('Handheld Console', 'gamecontroller'), device('Media Room Streaming Box', 'tv')])] }),
        RO.block({ tags: PROP, label: 'On and unavailable', kids: [grid([device('Media Room Streaming Box', 'tv', { on: true }), device('Handheld Console', 'gamecontroller', { u: true })])] }),
      ] });
    } });

  item({ n: 7, key: '07-media-music-sources', title: '7 · Media page Studio sources, with Game', note: 'Media page, Studio section: the same as 5 with a fourth source, Game.',
    render: function (ctx) {
      var ids = ['Game Console', 'server', 'pc', 'Game'];
      return RO.page(ctx, { title: 'Media', blocks: [
        RO.block({ tags: TODAY, kids: [RO.sub([RO.hdr('Studio'), remote('Studio Remote', 'appletvremote.gen4'), grid(srcToday(srcItems(ids, ['Game Console'])))])] }),
        RO.block({ tags: REC, kids: [RO.sub([RO.hdr('Studio'), remote('Studio Remote', 'appletvremote.gen4'), grid(srcNew(srcItems(ids, ['Game Console'])))])] }),
        RO.block({ tags: PROP, label: 'Game is the source', note: 'Not settled: MediaPageConfig lists Game as an active source for the Game Console tile too, so both read selected today. Drawn that way; the owner may prefer only Game checked.',
          kids: [grid(noSel(srcNew(srcItems(ids, ['Game Console', 'Game']))))] }),
      ] });
    } });

  item({ n: 8, key: '08-media-theater-devices', title: '8 · Media page Switch / streaming box', note: 'Media page, Media Room section: the same as 6.',
    render: function (ctx) {
      return RO.page(ctx, { title: 'Media', blocks: [
        RO.block({ tags: TODAY, kids: [RO.sub([RO.hdr('Media Room'), remote('Media Room', 'videoprojector'), grid([device('Handheld Console', 'gamecontroller', { today: true }), device('Media Room Streaming Box', 'tv', { today: true })])])] }),
        RO.block({ tags: REC, kids: [RO.sub([RO.hdr('Media Room'), remote('Media Room', 'videoprojector'), grid([device('Handheld Console', 'gamecontroller'), device('Media Room Streaming Box', 'tv')])])] }),
        RO.block({ tags: PROP, label: 'On and unavailable', kids: [grid([device('Media Room Streaming Box', 'tv', { on: true }), device('Handheld Console', 'gamecontroller', { u: true })])] }),
      ] });
    } });

  item({ n: 9, key: '09-light-switch', title: '9 · Lights and switches without dimming', note: 'Room lights sheet and overview detail (LightGroupTile\'s non-dimmable branch). Action tile with a power disc.',
    render: function (ctx) {
      return RO.sheet(ctx, { title: 'Entryway Lights', subtitle: 'Entryway', blocks: [
        RO.block({ tags: TODAY, note: 'A toggle tile: lit face when on, the lightbulb glyph leading.', kids: [grid([sw('Entryway Light', { today: true }), sw('Floodlight', { today: true, on: true })])] }),
        RO.block({ tags: REC, note: 'Action tile: text then a power disc (D, owner 2026-10-27: lights and switches use power). The lit face keeps its warm fill; the disc is the dark one BrightnessTile uses on a lit face.', kids: [grid([sw('Entryway Light'), sw('Floodlight', { on: true })])] }),
        RO.block({ tags: PROP, label: 'Unavailable', kids: [grid([sw('Floodlight', { u: true })])] }),
      ] });
    } });

  item({ n: 10, key: '10-light-dimmable', title: '10 · Dimmable lights (BrightnessTile without a sheet)', note: 'Room lights sheet, overview detail and the Custom Light sheet. Action tile with a power disc; the horizontal drag still sets brightness from the body.',
    render: function (ctx) {
      function lights(today) {
        var o = { today: today };
        return [full(dim('Kitchen Lights', 55, o)), dim('Table Light', 70, o), dim('Door Light', 0, o), dim('Counter Light', 30, o), dim('Sink Light', 0, { today: today, u: true })];
      }
      return RO.sheet(ctx, { title: 'Kitchen Lights', subtitle: 'Kitchen', blocks: [
        RO.block({ tags: TODAY, note: 'Lit tile with the glyph; tap flips power, a horizontal drag sets brightness; status is the percent.', kids: [grid(lights(true))] }),
        RO.block({ tags: REC, note: 'Action tile: the band and percent are unchanged, the glyph goes and a power disc trails. The body keeps tap = power and horizontal drag = brightness (the disc is a sibling, so a drag never starts on it). The group slab ("Kitchen Lights") takes the whole row.', kids: [grid(lights(false))] }),
        RO.block({ tags: PROP, label: 'Custom Light sheet', note: 'The single BrightnessTile at the top of the Custom Light sheet (the sheet itself is the details, so no chevron).', kids: [RO.cap('Today'), grid([full(dim('Left Door Light', 71, { today: true }))]), RO.cap('Proposed'), grid([full(dim('Left Door Light', 71))])] }),
      ] });
    } });

  item({ n: 11, key: '11-custom-lights', title: '11 · Custom Lights page tiles', note: 'Custom Lights page, Front Yard. These tiles already carry a power disc (it replaces the chevron today); they gain the chevron beside it.',
    render: function (ctx) {
      function todayTile(t, pct, u) { return MLC.lightTile({ title: t, percent: pct, open: true, unavailable: !!u }); }
      function newTile(t, pct, u) {
        var on = pct > 0 && !u;
        return T({ k: 'nav', t: t, s: u ? 'Unavailable' : (pct > 0 ? pct + '%' : 'Off'), sym: 'lightbulb', fam: 'lights', on: on, u: u, prog: on ? pct / 100 : undefined, acts: u ? null : [pwr(t, on)], wide: true });
      }
      return RO.page(ctx, { title: 'Custom Lights', blocks: [
        RO.block({ tags: TODAY, note: 'A power disc where the chevron would be; a tap opens the light\'s sheet, a drag sets brightness.', kids: [section('Front Yard', [todayTile('Left Door Light', 71), todayTile('Right Door Light', 0), todayTile('Bollard 1', 30), todayTile('Bollard 2', 0, true)])] }),
        RO.block({ tags: REC, note: 'Navigation tile with the disc left of the chevron (the fan rail geometry). An unavailable light has no disc, as today.', kids: [section('Front Yard', [newTile('Left Door Light', 71), newTile('Right Door Light', 0), newTile('Bollard 1', 30), newTile('Bollard 2', 0, true)])] }),
      ] });
    } });

  item({ n: 12, key: '12-overview-lights', title: '12 · Home overview Lights room cards (owner choice)', note: 'Home > Lights chip > the Lights overview sheet. The room cards are already navigation tiles. The choice is whether they carry a room power disc.',
    render: function (ctx) {
      function cards(disc) { return [roomLights('Living Room', '3 On', 4, { disc: disc }), roomLights('Kitchen', '2 On', 4, { disc: disc }), roomLights('Gym', 'Off', 1, { disc: disc }), roomLights('Office', 'On', 1, { disc: disc })]; }
      return RO.sheet(ctx, { title: 'Lights', subtitle: '5 On', blocks: [
        RO.block({ tags: TODAY, note: 'Navigation cards (glyph, text, chevron) that push the room\'s lights.', kids: [grid(cards(false))] }),
        RO.block({ tags: choice('A', false), label: 'No disc', note: 'Keep the cards as they are. Two to a row on a phone.', kids: [grid(cards(false))] }),
        RO.block({ tags: choice('B', true), label: 'Room power disc', note: 'A power disc left of the chevron turns the whole room\'s lights off or on (the room\'s group light; every room has one). It makes the sheet a place to switch off forgotten lights. Cost: each card needs the room, so a phone shows one per row (14 rows, not 7).', kids: [grid(cards(true))] }),
      ] });
    } });

  item({ n: 13, key: '13-hot-flash', title: '13 · Bed sheet Hot Flash Mode', note: 'Bed side sheet, Special Modes tab. Action tile: the disc is snowflake to start and becomes a stop disc while the mode runs; the countdown moves into the subtitle.',

      function xmark() { return h('button', { type: 'button', 'aria-label': 'Cancel Hot Flash Mode', style: { width: '44px', height: '44px', borderRadius: '50%', border: 0, background: 'rgba(120,120,128,.36)', color: 'var(--ink, #fff)', display: 'grid', placeItems: 'center' }, html: I('xmark', { weight: 2.2 }) }); }
      function todayRow(active) {
        var t = T({ k: 'cmd', t: 'Hot Flash Mode', s: active ? 'Active' : 'Inactive', sym: 'snowflake', fam: 'cooling', on: active });
        t.style.flex = '1'; t.style.minWidth = '0';
        return h('div', { style: { display: 'flex', gap: '12px', alignItems: 'center' } }, t, active ? h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' } }, h('span', { style: { fontSize: 'var(--fs-sub)', fontVariantNumeric: 'tabular-nums', color: 'var(--ink, #fff)' } }, '10:12 Remaining'), xmark()) : null);
      }
      function newTile(state, id) {
        var active = state === 'active', u = state === 'ro';
        var t = T({ k: 'act', t: 'Hot Flash Mode', s: u ? 'Unavailable' : (active ? '10:12 Remaining' : 'Inactive'), sym: 'snowflake', fam: 'cooling', on: active, u: u,
          acts: [active ? D('stop.fill', 'Cancel Hot Flash Mode', false) : D('snowflake', 'Start Hot Flash Mode', false, u)], id: id });
        return t;
      }
      var cap = h('p.ro-note', 'Activating hot flash mode will set the bed to -10 for fifteen minutes.');
      return RO.sheet(ctx, { title: 'Alex\'s Bed', subtitle: 'Special Modes', blocks: [
        RO.block({ tags: TODAY, note: 'A command tile; while it runs a countdown and an x button sit beside it. The tile ignores a tap while active.', kids: [cap.cloneNode(true), todayRow(false), todayRow(true)] }),
        RO.block({ tags: REC, note: 'One tile, one control. Idle: snowflake starts the mode. Active: the tile fills cooling teal, the disc becomes stop, the subtitle counts down (the app falls back to "Cooling Bed" with no countdown). The body and the disc both cancel. The separate countdown and x button go.', kids: [cap.cloneNode(true), grid([newTile('idle', 'ro.hotflash.idle'), newTile('active', 'ro.hotflash.active')], { min: 280 })] }),
        RO.block({ tags: PROP, label: 'Read-only', note: 'On the traveler\'s side during a Solo Trip, or when Hot Flash is unavailable: the tile and disc dim in place.', kids: [grid([newTile('ro')], { min: 280 })] }),
      ] });
    } });

  item({ n: 14, key: '14-fan-sheet', title: '14 · Bathroom fan sheet Power and Lock', note: 'Bathroom fan sheet, Controls. Both become action tiles; the discs use the fan rail\'s glyphs (power, lock.fill, lock.open).',
    render: function (ctx) {
      function todayTiles(on, locked, lockAvail) {
