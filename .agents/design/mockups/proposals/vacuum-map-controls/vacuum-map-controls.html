(function () {
  var h = Mock.h, I = Mock.icon, dv = Mock.dv, vac = dv.vac, V = vac.V; var BTN = 'button';

  var DEFAULT = [{ corner: 'top-leading', axis: 'column', buttons: [B.locate] }];

  /* The fit rule of the spec (build/design/vacuum-map-ctl.md, Corner groups: fit): 44 pt per button, 8 pt insets, 12 pt between two groups on one edge; what does not fit goes behind More. */
  function place(frame, groups, sel) {
    var W = frame.offsetWidth, H = frame.offsetHeight; if (!W || !H) return;

    groups.forEach(function (g) {

      }
    }

    if (!c.groups) return card;   // the default: today's Locate, untouched

  add('unavailable', 'Robot unavailable', 'Locate hides, as today. Authored service and navigation buttons stay. The fallback text keeps clear of a corner that holds buttons.', { v: V({ scenario: 'unavailable' }) }, { groups: ROW3 });
  add('reduce-transparency', 'Reduce Transparency', 'The glass becomes an opaque fill: dark grey in dark, white in light.', {}, { groups: ROW3 }, { reduceTransparency: true });
  add('increase-contrast', 'Increase Contrast', 'An opaque fill with a 1 pt outline in the symbol colour; the symbols are 21:1 on it.', {}, { groups: ROW3, contrast: true });
  add('ax5', 'Accessibility 5 text size', 'The buttons keep 44 pt and their symbols keep their size; a long press shows the label large. The text around the map grows.', {}, { groups: ROW3 }, { ts: 'ax5' });

  /* ---- sections: the four orientations side by side, and the Studio inspector */
  function four() {
    function one(label, c) { return h('figure', h('div.k-swatch.sheet.in-sheet.g-dark', { style: { padding: '10px' } }, decorate(baseCard({ map: 'main', selected: ['kitchen', 'living_room'], robot: [220, 110], path: [[40, 50], [110, 80], [170, 40], [240, 90], [220, 110]] }), c)), h('figcaption', label)); }

    return h('div.mi' + (dark ? '.dk' : ''), { role: 'group', 'aria-label': 'Studio inspector, ' + (dark ? 'dark' : 'light') },
      h('div', h('div.crumb', 'Main Floor Robot Vacuum › Map'), h('div.ttl', 'Map'),

        h('div.row', h('span.sp', 'Flip Horizontally'), h(BTN + '.sw.on', { type: 'button', role: 'switch', 'aria-checked': 'true', 'aria-label': 'Flip Horizontally' })),

        corner('bl', 'Bottom Leading', 'Empty'), corner('bt', 'Bottom Trailing', 'Empty'),
        h('div.check', h('b', 'Fits. '), 'Top Trailing shows all 3 buttons on iPhone, iPhone Duo and iPad.')),
      h('div', h('div.crumb', '‹ Map'), h('div.ttl', sym('lightbulb.fill'), 'Kitchen Lights'),
        h('div.grp', 'Button'),
        h('div.row', h('span.lbl', 'Icon'), h('span.fld', 'lightbulb.fill ▾')),
        h('div.row', h('span.lbl', 'Label'), h('span.fld', 'Kitchen Lights')),
        h('p.foot', 'VoiceOver and Voice Control use the label. It is required.'),
        h('div.row', h('span.lbl', 'Hint'), h('span.fld', 'Turns the kitchen lights on or off.')),
        h('div.grp', 'Action'),
        h('div.row', h('span.lbl', 'Type'), h('span.seg', h('span.on', 'Service'), h('span', 'Navigate'))),
        h('div.row', h('span.lbl', 'Service'), h('span.fld', 'light.toggle')),
        h('div.row', h('span.lbl', 'Target'), h('span.fld', 'light.demo_kitchen_1')),

        h('div.grp', 'Place'),
        h('div.row', h('span.lbl', 'Corner'), h('span.fld', 'Top Trailing ▾')),

    summary: 'Owner request 2026-11-16: flip the map horizontally, vertically or both, and place any number of map buttons as a row or a column in each of the four corners, in an order the owner sets. The default draws today\'s map: no flip, Locate alone at top leading. Shown on the vacuum sheet for iPhone, iPhone Duo and iPad in dark and light, with the Studio inspector that authors it. Built as drawn on t3/native-ingest (4b066cd6); the current design is the vacuum sheet and map canvas mockups, and README.md beside this page lists what the build settled.',

      { rule: 'Reading order', note: 'The map element, then the groups top leading, top trailing, bottom leading, bottom trailing, each in its authored order. More is last in its group and opens a menu of the hidden buttons by label.' },
      { rule: '44 pt targets', note: 'Every button is 44 by 44 pt at every text size (HIG Buttons: "the hit region is at least 44x44 pt"). Two groups on one edge keep 12 pt apart.' },

    reviews: {
