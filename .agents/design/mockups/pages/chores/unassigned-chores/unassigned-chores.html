        { rule: "Writing: say what the list is and what to do", verdict: "pass", note: "ChoresConfig.unassignedChores emptyDescription is \"There are no unassigned chores due. Nice job!\"; the hyphen typo is gone. Add Task stays in the page chrome.", by: "apple-hig skill" },
        { rule: "Undo and redo: a task completed by anyone", verdict: "pass", note: "Undo also covers unassigned chores: the same todo.update_item needs_action call restores it to every resident's list within the 5 s window (TodoListController.undo).", by: "apple-hig skill" },

    ],
  }));

})();
