      h('div', { style: { display: 'flex', height: '26px', borderRadius: '6px', overflow: 'hidden', border: '1px solid var(--k-line)', flex: '1 1 380px', maxWidth: '640px' } }, parts.map(function (p) { return h('div', { style: { flex: p[0] + ' 1 0', background: p[1], color: p[2] || '#fff', font: '600 11px/26px var(--mono)', textAlign: 'center', whiteSpace: 'nowrap', overflow: 'hidden' } }, p[3] || ''); }))); }
    return h('div', { style: { color: 'var(--k-fg)' } },

        h('div.sn-row', { style: { marginTop: '12px' } }, SN.stripSwatch({ leading: 'menu', arc: true, badge: 3 }, 'header, down 2 s+'), SN.stripSwatch({ leading: 'menu', badge: 3 }, 'header, live (arc gone, nothing moved)')));
    } },
    'offline': { title: 'Offline: the chip (no network path)', note: 'icloud.slash, "Offline. Showing last known values.", cloud badge on Profile', render: function (ctx) {
      return board(ctx, 'offline', { iphone: 'The chip sits under the header at the trailing edge, clear of the large title; values stay on screen.' }); } },

  function figEl(stage, key) { return stage.querySelector('.sn-fig[data-device="' + key + '"]'); }
  function chipRow(stage) { return stage.querySelector('.ui-conn-row'); }

  Mock.mount(Object.assign(base, {
    id: 'reconnecting-arc', title: 'Reconnecting arc and offline chip', area: 'shell', status: 'shipped',
    summary: 'How the shell says the values on screen may be stale. A 20 pt white arc in the header, left of Quick Links, while the connection retries (after 2 s down, or at once before the first state arrives); the offline chip under the header when there is no network path. Decision: .agents/design/reconnecting-spinner.md.',
    source: ['apple/Sources/HassUI/App/Shell/ReconnectingArc.swift', 'apple/Sources/HassUI/App/Shell/ReconnectingIndicatorHost.swift', 'apple/Sources/HassUI/UIKitPort/App/Shell/UKOfflineChip.swift', 'apple/Sources/HassUI/App/Shell/OfflineOverlay.swift', 'apple/Sources/HassUI/UIKitPort/App/Shell/UKShellHeaderItems.swift', 'apple/Sources/HassCore/Connection/ReconnectingIndicator.swift', 'apple/Sources/HassCore/Connection/ReconnectingPolicy.swift'],

    patterns: ['motion'],
    hig: ['Progress indicators', 'Loading', 'Toolbars', 'Accessibility'],

    devices: ['iphone', 'duo-folded', 'duo-unfolded-portrait', 'duo-unfolded-landscape', 'ipad-portrait', 'ipad-landscape'],
    states: states,
    motion: [
      { id: 'arc-fade', what: 'The reconnecting arc fades in once the connection has been down 2 s, and out when live again ', token: 'crossFade 0.35 s ease-in-out each way (MotionTokens.crossFade, reducedMoment); 2 s delay is ReconnectingPolicy.delay', state: 'arc',
        source: 'ReconnectingArc.swift; decision in .agents/design/reconnecting-spinner.md', reduce: 'unchanged: opacity is not motion, so Reduce Motion keeps the fade',
        play: function (stage) { var s = stage.querySelector('.ui-slot'); return Mock.anim.arc(s, false).then(function () { return Mock.sleep(500); }).then(function () { return Mock.anim.arc(s, true); }).then(function () { return Mock.sleep(900); }); } },
      { id: 'arc-turn', what: 'The arc turns, one turn per 0.82 s, while it is visible', token: 'ArcSpinner: linear 0.82 s per turn, repeats; spinners are an allowed repeatForever (motion.md section 7)', state: 'arc',
        source: 'HassDesign/ArcSpinner.swift', reduce: 'half speed (1.64 s a turn): a still arc reads as frozen',
        play: function () { return Mock.sleep(3000); } },
      { id: 'offline-chip-enter', what: 'The offline chip comes in under the header and goes out again', token: 'standard 0.3 s smooth: opacity plus .move(edge: .top)', state: 'offline',
        source: 'OfflineOverlay.swift: .animation(standard, value: isOffline)', reduce: 'cross-fade on crossFade 0.35 s, no move',

          var row = chipRow(stage); if (!row) return Promise.resolve();

          return row.animate(inK, { duration: ms, easing: Mock.anim.easing.standard, fill: 'both' }).finished.then(function () { return Mock.sleep(900); }).then(function () { return row.animate(outK, { duration: ms, easing: Mock.anim.easing.standard, fill: 'both' }).finished; }).then(function () { return Mock.sleep(200); });
        } },
    ],
    transitions: [
      { from: 'Live', to: 'Reconnecting (arc)', kind: 'fade', state: 'arc', note: 'The connection drops; after 2 s the arc is placed in the bar and fades up. Quick Links and Profile never move (the group grows to the left). A blip shorter than 2 s shows nothing; coming back mid fade-out lights it again where it is.',
        play: function (stage) { var s = stage.querySelector('.ui-slot'); return Mock.anim.arc(s, false).then(function () { return Mock.sleep(300); }).then(function () { return Mock.anim.arc(s, true); }).then(function () { return Mock.sleep(800); }); } },

    a11y: [
      { rule: 'Arc', note: 'One element, "Reconnecting to Home Assistant" ("Connecting to Home Assistant" on the first connect), updatesFrequently, no action and no 44 pt target: it is a status, not a control (reconnecting.arc). VoiceOver reaches it after Open Navigation and before Quick Links. It is hidden entirely (not just transparent) when live.' },
      { rule: 'Offline chip', note: 'One combined element "Offline. Showing last known values." (offline.chip); the Profile button adds "Offline" to its value and its own cloud badge label (nav.offline).' },

        { rule: 'Loading: show an indicator only for a wait that matters', verdict: 'pass', note: 'The arc waits ReconnectingPolicy.delay (2 s) and clears when live; offline shows at once (ReconnectingPolicy.swift, OfflineOverlay.swift).', by: 'apple-hig skill' },
        { rule: 'Layout: do not cover content with transient chrome', verdict: 'pass', note: 'The reconnecting sign is a header bar item, not an overlay on page content; only the offline chip sits under the header, at the trailing edge, clear of the large title.', by: 'apple-hig skill' },
        { rule: 'Motion: Reduce Motion', verdict: 'pass', note: 'The offline chip fades without moving (OfflineOverlay.swift); the arc is the departure below.', by: 'apple-hig skill' },
        { rule: 'Writing: say the state and what it means', verdict: 'pass', note: '"Offline. Showing last known values." (OfflineChip.swift); the arc has a spoken label and no text.', by: 'apple-hig skill' },
        { rule: 'Motion: make motion optional (arc)', verdict: 'departure', note: 'The arc keeps turning at half speed under Reduce Motion (owner 2026-10-14, direction-g.md Loading and feedback).', by: 'apple-hig skill' },

      ],
    },

      'Offline is not reconnecting: a connection with no network path shows the offline chip at once and never the arc (ReconnectingPolicy.showsArc).',
      'On the folded Duo the arc stays in the horizontal page header, trailing (ShellHeaderItems passes besideQuickLinks: false); it never joins the rail.',
      'Promote to kit: nothing; SN.strip and SN.board are local helpers in components/navigation/_shell-navigation.js.',
    ],
    changelog: [{ date: '2026-10-23', note: 'First pass: arc, offline chip, timeline, Reduce Motion, AX5.' }, { date: '2026-10-28', note: 'Arc shipped: renamed from reconnecting-chip; chip states and motions removed; status shipped.' }],
  }));
