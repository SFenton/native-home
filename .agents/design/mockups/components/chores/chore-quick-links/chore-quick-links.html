<script>

      'sam': { title: 'Signed in as Sam', note: 'titles swap: "Alex\'s Chores" and "Your Chores"; each link keeps its colour whoever is signed in', render: function (ctx) { return pageSw(ctx, '370 pt', box(370, C.quickLinks({ viewer: 'sam' }))); } },

      swiftui: [
